<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestre de Obras 3D — ArchViz Procedural</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 42%, #1e2631 0%, #11161f 62%, #090c12 100%);
            user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .dock-surface {
            background: rgba(11, 15, 22, 0.80);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.50);
        }
        .tool-btn {
            transition: all 0.16s ease;
            color: #cbd5e1;
            white-space: nowrap;
        }
        .tool-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.09);
            color: #ffffff;
        }
        .tool-btn.active {
            background: rgba(217, 119, 6, 0.24);
            border-color: rgba(245, 158, 11, 0.72);
            color: #fde68a;
        }
        .tool-btn.xray-on {
            background: rgba(14, 165, 233, 0.25);
            border-color: rgba(56, 189, 248, 0.75);
            color: #bae6fd;
        }
        .tool-btn.erase-on {
            background: rgba(225, 29, 72, 0.25);
            border-color: rgba(244, 63, 94, 0.75);
            color: #fecdd3;
        }
        .tool-btn:disabled {
            opacity: 0.32;
            cursor: not-allowed;
        }
        .swatch-btn {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .swatch-btn:hover {
            transform: scale(1.18);
        }
        .swatch-btn.active {
            box-shadow: 0 0 0 2px #f59e0b;
            transform: scale(1.15);
        }
    </style>
</head>
<body class="text-slate-200">

    <!-- Container WebGL 100vw x 100vh -->
    <div id="canvas-container" class="relative w-full h-screen overflow-hidden"></div>

    <!-- Pill Superior Esquerdo: Fase Atual + Seed do Terreno -->
    <div class="fixed top-4 left-4 z-20 dock-surface rounded-xl px-3.5 py-2 flex items-center gap-2.5 pointer-events-none">
        <span id="phase-dot" class="w-2 h-2 rounded-full bg-amber-500"></span>
        <span id="phase-indicator" class="text-[11px] font-semibold tracking-wider uppercase text-slate-200">
            FASE 1 · TERRENO & PLANTA · SEED #4821
        </span>
    </div>

    <!-- Pill Superior Direito: Controles Globais -->
    <div class="fixed top-4 right-4 z-20 dock-surface rounded-xl p-1 flex items-center gap-1">
        <button id="btn-hire-worker" onclick="hireMiniWorker()" class="tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-transparent text-[11px] font-medium" title="Contratar Mini Ajudante Autônomo">
            <span>👷</span><span id="worker-btn-label">Ajudante (0/3)</span>
        </button>
        <div class="w-px h-4 bg-white/10"></div>
        <button id="btn-xray" onclick="toggleXRayMode()" class="tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-transparent text-[11px] font-medium" title="Alternar Modo Raio-X (Ver Instalações)">
            <span>👁️</span><span>Raio-X</span>
        </button>
        <div class="w-px h-4 bg-white/10"></div>
        <button id="tool-erase" onclick="selectTool('erase')" class="tool-btn flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-transparent text-[11px] font-medium" title="Apagar / Demolir">
            <span>🗑️</span><span>Apagar</span>
        </button>
        <div class="w-px h-4 bg-white/10"></div>
        <button id="btn-new-terrain" onclick="regenerateNewTerrain()" class="tool-btn flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-transparent text-[11px] font-medium text-sky-300" title="Gerar Novo Terreno Procedural">
            <span>🎲</span><span>Novo Terreno</span>
        </button>
    </div>

    <!-- Notificação Flutuante Sutil (Topo Centro) -->
    <div id="toast-box" class="fixed top-16 left-1/2 -translate-x-1/2 z-40 pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-2">
        <div class="dock-surface px-4 py-1.5 rounded-full text-xs font-medium text-amber-200 flex items-center gap-2 whitespace-nowrap">
            <span id="toast-icon">📐</span>
            <span id="toast-message">Pronto para iniciar a obra</span>
        </div>
    </div>

    <!-- DOCK ÚNICO CONTEXTUAL (1 LINHA LIMPA POR FASE, SEM SCROLL) -->
    <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 dock-surface rounded-2xl px-2 py-1.5 z-20 max-w-[98vw]">

        <!-- FASE 1: TERRENO, TERRAPLANAGEM & PLANTA -->
        <div id="dock-phase-1" class="flex items-center gap-1">
            <button id="tool-level" onclick="selectTool('level')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Nivelar</button>
            <button id="tool-room" onclick="selectTool('room')" class="tool-btn active px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Cômodo</button>
            <button id="tool-door" onclick="selectTool('door')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Porta</button>
            <button id="tool-window" onclick="selectTool('window')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Janela</button>
            <button id="tool-muro" onclick="selectTool('muro')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Muro</button>
            <button id="tool-stair" onclick="selectTool('stair')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Escada</button>
            <div class="w-px h-5 bg-white/10 mx-1"></div>
            <button onclick="loadPresetHouse()" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium text-sky-300">✨ Modelo</button>
            <button onclick="advanceToPhase2()" class="ml-1 px-3.5 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold tracking-wide transition whitespace-nowrap">
                Iniciar Obra →
            </button>
        </div>

        <!-- FASE 2: FUNDAÇÃO, ARMADURAS, CAIXARIA & MASSEIRA -->
        <div id="dock-phase-2" class="hidden flex items-center gap-1">
            <button id="tool-dig" onclick="selectTool('dig')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">1. Cavar</button>
            <button id="tool-rebar" onclick="selectTool('rebar')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">2. Armaduras</button>
            <button id="tool-formwork" onclick="selectTool('formwork')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">3. Caixaria</button>
            <button id="tool-mixer" onclick="selectTool('mixer')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">4. Masseira</button>
            <button id="tool-pour-col" onclick="selectTool('pour-col')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">5. Concretar</button>

            <div id="sub-rebar" class="hidden flex items-center pl-1.5 ml-1 border-l border-white/10">
                <button onclick="spawnFallingRebars()" class="px-2.5 py-1 rounded-lg bg-amber-600/90 hover:bg-amber-500 text-white text-[11px] font-semibold">+ Pedir Ferros</button>
            </div>
            <div id="sub-mixer" class="hidden flex items-center gap-2 pl-2 ml-1 border-l border-white/10 text-[11px] text-slate-300">
                <span>Areia <b id="cnt-sand" class="text-amber-300">0/3</b></span>
                <span>Cim <b id="cnt-cement" class="text-white">0/1</b></span>
                <span>Água <b id="cnt-water" class="text-sky-300">0/1</b></span>
                <span>Mix <b id="cnt-mix" class="text-emerald-400">0%</b></span>
                <button onclick="restockSupplies()" class="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/15 text-[11px] font-medium text-white">Repor</button>
            </div>
            <div class="w-px h-5 bg-white/10 mx-1"></div>
            <span id="bucket-pill-2" class="text-[11px] text-slate-400 px-1.5">🪣 0/4</span>
            <button id="btn-go-p3" onclick="advanceToPhase3()" class="ml-1 px-3 py-1.5 rounded-xl bg-emerald-600/90 hover:bg-emerald-500 text-white text-xs font-semibold transition whitespace-nowrap">
                Alvenaria →
            </button>
        </div>

        <!-- FASE 3: ALVENARIA ERGONÔMICA, MURO & CONTRAPISO -->
        <div id="dock-phase-3" class="hidden flex items-center gap-1">
            <button id="tool-prop" onclick="selectTool('prop')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium text-amber-300">Escora Vão</button>
            <button id="tool-wall" onclick="selectTool('wall')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Paredes</button>
            <button id="tool-floor" onclick="selectTool('floor')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Contrapiso</button>
            <button id="tool-mixer-3" onclick="selectTool('mixer')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Masseira</button>
            <div class="w-px h-5 bg-white/10 mx-0.5"></div>
            <button id="brick-standard" onclick="setBrickType('standard')" class="tool-btn active px-2 py-1 rounded-lg border border-transparent text-[11px] font-medium">Baiano</button>
            <button id="brick-block" onclick="setBrickType('block')" class="tool-btn px-2 py-1 rounded-lg border border-transparent text-[11px] font-medium">Bloco</button>
            <button onclick="spawnBrickPallet()" class="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/15 text-[11px] font-medium text-white">+ Palete</button>
            <button onclick="restockSupplies()" class="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/15 text-[11px] font-medium text-slate-300">+ Sacos</button>
            <span id="bucket-pill-3" class="text-[11px] text-slate-400 px-1">🪣 0/4</span>
            <button onclick="advanceToPhase4()" class="ml-1 px-3 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold transition whitespace-nowrap">
                Instalações →
            </button>
        </div>

        <!-- FASE 4: INSTALAÇÕES MEP (ELÉTRICA & HIDRÁULICA COM RAIO-X) -->
        <div id="dock-phase-4" class="hidden flex items-center gap-1">
            <button id="tool-elec" onclick="selectTool('elec')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">⚡ Elétrica</button>
            <button onclick="testElectricalSystem()" class="px-2.5 py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/35 border border-amber-500/50 text-amber-200 text-xs font-semibold transition">
                ⚡ Testar Energia
            </button>
            <div class="w-px h-5 bg-white/10 mx-1"></div>
            <button id="tool-plumb" onclick="selectTool('plumb')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">💧 Hidráulica</button>
            <button onclick="testPlumbingSystem()" class="px-2.5 py-1.5 rounded-xl bg-sky-500/20 hover:bg-sky-500/35 border border-sky-500/50 text-sky-200 text-xs font-semibold transition">
                💧 Abrir Registro
            </button>
            <div class="w-px h-5 bg-white/10 mx-1"></div>
            <button onclick="advanceToPhase5()" class="ml-1 px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition whitespace-nowrap">
                Acabamento →
            </button>
        </div>

        <!-- FASE 5: CINTA, TELHADO 2 ÁGUAS, REBOCO RECORTADO, ESQUADRIAS & PINTURA -->
        <div id="dock-phase-5" class="hidden flex items-center gap-1">
            <button id="tool-beam" onclick="selectTool('beam')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Cinta</button>
            <button id="tool-roof" onclick="selectTool('roof')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Telhado</button>
            <button id="tool-plaster" onclick="selectTool('plaster')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Reboco</button>
            <button id="tool-fixtures" onclick="selectTool('fixtures')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Esquadrias</button>
            <button id="tool-paint" onclick="selectTool('paint')" class="tool-btn px-2.5 py-1.5 rounded-xl border border-transparent text-xs font-medium">Pintura</button>
            <div class="w-px h-5 bg-white/10 mx-1"></div>
            <div class="flex items-center gap-1.5 px-1">
                <button onclick="setPaintColor('#f1f5f9', this)" class="swatch-btn active w-4 h-4 rounded-full border border-white/40" style="background:#f1f5f9" title="Branco Neve"></button>
                <button onclick="setPaintColor('#dfd3be', this)" class="swatch-btn w-4 h-4 rounded-full border border-white/40" style="background:#dfd3be" title="Areia Quente"></button>
                <button onclick="setPaintColor('#94a3b8', this)" class="swatch-btn w-4 h-4 rounded-full border border-white/40" style="background:#94a3b8" title="Cinza Arquitetônico"></button>
                <button onclick="setPaintColor('#c9866b', this)" class="swatch-btn w-4 h-4 rounded-full border border-white/40" style="background:#c9866b" title="Terracota Suave"></button>
                <button onclick="setPaintColor('#8fa893', this)" class="swatch-btn w-4 h-4 rounded-full border border-white/40" style="background:#8fa893" title="Verde Sálvia"></button>
            </div>
        </div>
    </footer>

    <script>
    // =========================================================================
    // 0. MOTOR DE ÁUDIO PROCEDURAL (WEB AUDIO API — ZERO ARQUIVOS EXTERNOS)
    // =========================================================================
    const SoundFX = {
        ctx: null,
        init() {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) this.ctx = new AC();
            }
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        },
        playBrickClack() {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(145, now + 0.08);
            g.gain.setValueAtTime(0.16, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.09);
        },
        playMortarSquish() {
            this.init();
            if (!this.ctx) return;
            const len = Math.floor(this.ctx.sampleRate * 0.08);
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));
            const src = this.ctx.createBufferSource();
            src.buffer = buf;
            const f = this.ctx.createBiquadFilter();
            f.type = 'bandpass'; f.frequency.value = 360;
            const g = this.ctx.createGain(); g.gain.value = 0.14;
            src.connect(f); f.connect(g); g.connect(this.ctx.destination);
            src.start();
        },
        playMixerScrape() {
            this.init();
            if (!this.ctx) return;
            const len = Math.floor(this.ctx.sampleRate * 0.06);
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
            const src = this.ctx.createBufferSource();
            src.buffer = buf;
            const f = this.ctx.createBiquadFilter();
            f.type = 'bandpass'; f.frequency.value = 600 + Math.random() * 260; f.Q.value = 1.8;
            const g = this.ctx.createGain(); g.gain.value = 0.08;
            src.connect(f); f.connect(g); g.connect(this.ctx.destination);
            src.start();
        },
        playHammerWood() {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(195, now);
            osc.frequency.exponentialRampToValueAtTime(62, now + 0.11);
            g.gain.setValueAtTime(0.22, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.12);
        },
        playMetalClang() {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(720, now);
            osc.frequency.exponentialRampToValueAtTime(280, now + 0.16);
            g.gain.setValueAtTime(0.11, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.17);
        },
        playDirtShovel() {
            this.init();
            if (!this.ctx) return;
            const len = Math.floor(this.ctx.sampleRate * 0.11);
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / len) * Math.PI);
            const src = this.ctx.createBufferSource();
            src.buffer = buf;
            const f = this.ctx.createBiquadFilter();
            f.type = 'lowpass'; f.frequency.value = 520;
            const g = this.ctx.createGain(); g.gain.value = 0.16;
            src.connect(f); f.connect(g); g.connect(this.ctx.destination);
            src.start();
        },
        playElectricSwitch() {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(1100, now);
            osc.frequency.setValueAtTime(1550, now + 0.03);
            g.gain.setValueAtTime(0.09, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.07);
        },
        playWaterRush() {
            this.init();
            if (!this.ctx) return;
            const len = Math.floor(this.ctx.sampleRate * 0.35);
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / len) * Math.PI);
            const src = this.ctx.createBufferSource();
            src.buffer = buf;
            const f = this.ctx.createBiquadFilter();
            f.type = 'bandpass'; f.frequency.value = 950; f.Q.value = 0.9;
            const g = this.ctx.createGain(); g.gain.value = 0.14;
            src.connect(f); f.connect(g); g.connect(this.ctx.destination);
            src.start();
        }
    };

    // =========================================================================
    // 1. CONSTANTES E ESTADO GLOBAL
    // =========================================================================
    const DIORAMA_R = 9.2;
    const GRID_SIZE = 10;          // Grade 10x10 metros
    const GRID_OFFSET_Z = -0.8;    // Desloca ligeiramente para trás do lago
    const PLATEAU_Y = 0.28;        // Altura alvo de terraplanagem
    const WATER_LEVEL = -0.36;     // Nível do lago reflexivo
    const WALL_HEIGHT = 1.80;      // Altura das paredes da casa

    const LEVEL_RES = 45;          // Resolução do mapa de terraplanagem
    const levelMap = new Float32Array(LEVEL_RES * LEVEL_RES);

    let toastTimer = null;

    const state = {
        seed: Math.floor(1000 + Math.random() * 8999),
        phase: 1,                  // 1..5
        tool: 'room',
        xray: false,
        brickType: 'standard',     // 'standard' (6 fiadas) | 'block' (4 fiadas)
        paintColorHex: '#f1f5f9',

        // Masseira & Balde
        sand: 0,
        cement: 0,
        water: 0,
        mixProgress: 0,
        mortarCharges: 0,
        bucketCharges: 0,

        // Projeto & Construção
        houseBaseY: PLATEAU_Y,
        occupiedCells: new Set(),  // "gx,gz"
        columns: [],
        walls: [],
        muros: [],                 // Muros de divisa/arrimo escalonados
        stairs: [],                // Escadas externas de concreto
        floorTiles: [],

        // Fase 4 MEP
        elecNodes: [],             // { id, type:'qdc'|'outlet', x,y,z, wallRef, mesh, connected }
        elecConduits: [],
        elecLights: [],
        elecPowerOn: false,
        plumbNodes: [],            // { id, type:'tank'|'fixture'|'sewage', x,y,z, mesh, connected }
        plumbPipes: [],
        waterFlowActive: false,
        leakPoints: [],

        // Fase 5 Telhado
        roofStage: 0,              // 0: nada, 1: oitões+madeiramento, 2: telhas completas

        // Objetos Físicos
        looseRebars: [],
        draggableSupplies: [],
        looseBricks: [],
        selectedBrickInHand: null,
        draggedItem: null,

        // Trabalhadores & FX
        workers: [],
        animatedBricks: [],
        particles: [],
        isStirringMixer: false,
        isLevelingTerrain: false,
        lastStirPos: new THREE.Vector2(),
        lastScrapeTime: 0,
        lastShovelTime: 0
    };

    // Posições das estações laterais (altura obtida via getTerrainHeight)
    const STATION_MIXER = { x: -5.9, z: 0.6 };
    const STATION_REBAR = { x: -4.8, z: 3.5 };
    const STATION_BRICK = { x: 6.0, z: 0.5 };

    // =========================================================================
    // 2. GERADOR PROCEDURAL DE TERRENO (FONTE ÚNICA DA VERDADE)
    // =========================================================================
    function hash2D(ix, iz, seed) {
        let n = Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(seed, 1442695041);
        n = (n ^ (n >>> 13)) >>> 0;
        n = Math.imul(n, 1274126177) >>> 0;
        return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
    }

    function valueNoise2D(x, z, seed) {
        const ix = Math.floor(x);
        const iz = Math.floor(z);
        const fx = x - ix;
        const fz = z - iz;
        const u = fx * fx * (3 - 2 * fx);
        const v = fz * fz * (3 - 2 * fz);
        const a = hash2D(ix, iz, seed);
        const b = hash2D(ix + 1, iz, seed);
        const c = hash2D(ix, iz + 1, seed);
        const d = hash2D(ix + 1, iz + 1, seed);
        return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
    }

    function fbmNoise(x, z, seed) {
        let val = 0;
        let amp = 0.55;
        let freq = 0.16;
        for (let o = 0; o < 4; o++) {
            val += (valueNoise2D(x * freq, z * freq, seed + o * 101) - 0.5) * 2 * amp;
            freq *= 2.05;
            amp *= 0.48;
        }
        return val;
    }

    function sampleLevelWeight(x, z) {
        const u = ((x / (DIORAMA_R * 2)) + 0.5) * (LEVEL_RES - 1);
        const v = ((z / (DIORAMA_R * 2)) + 0.5) * (LEVEL_RES - 1);
        if (u < 0 || u >= LEVEL_RES - 1 || v < 0 || v >= LEVEL_RES - 1) return 0;
        const ix = Math.floor(u), iz = Math.floor(v);
        const fx = u - ix, fz = v - iz;
        const w00 = levelMap[iz * LEVEL_RES + ix];
        const w10 = levelMap[iz * LEVEL_RES + ix + 1];
        const w01 = levelMap[(iz + 1) * LEVEL_RES + ix];
        const w11 = levelMap[(iz + 1) * LEVEL_RES + ix + 1];
        return (w00 * (1 - fx) + w10 * fx) * (1 - fz) + (w01 * (1 - fx) + w11 * fx) * fz;
    }

    function paintLevelWeight(wx, wz, radius, strength) {
        for (let iz = 0; iz < LEVEL_RES; iz++) {
            const z = ((iz / (LEVEL_RES - 1)) - 0.5) * (DIORAMA_R * 2);
            if (Math.abs(z - wz) > radius) continue;
            for (let ix = 0; ix < LEVEL_RES; ix++) {
                const x = ((ix / (LEVEL_RES - 1)) - 0.5) * (DIORAMA_R * 2);
                const dist = Math.hypot(x - wx, z - wz);
                if (dist < radius) {
                    const falloff = 1 - (dist / radius);
                    const smooth = falloff * falloff * (3 - 2 * falloff);
                    const idx = iz * LEVEL_RES + ix;
                    levelMap[idx] = Math.min(1, levelMap[idx] + smooth * strength);
                }
            }
        }
    }

    // FONTE ÚNICA DA VERDADE DE ELEVAÇÃO PARA TODO O SIMULADOR
    function getTerrainHeight(x, z) {
        const s = state.seed;
        const slopeDirX = (hash2D(1, 2, s) - 0.5) * 0.14;
        const slopeDirZ = -0.09 + (hash2D(3, 4, s) - 0.5) * 0.08;

        // Relevo base com aclive/declive natural e colinas suaves
        let h = 0.22 + x * slopeDirX + z * slopeDirZ + fbmNoise(x, z, s) * 1.15;

        // Colina ao fundo (norte) para enquadramento arquitetônico
        if (z < -4.2) {
            const backDist = Math.min(4.5, -4.2 - z);
            h += backDist * 0.24;
        }

        // Bacia do lago reflexivo na frente-direita do diorama
        const pondCenterX = 1.4 + (hash2D(7, 8, s) - 0.5) * 1.6;
        const pondCenterZ = 5.8;
        const pondDist = Math.hypot((x - pondCenterX) * 0.72, (z - pondCenterZ) * 1.15);
        if (pondDist < 3.6) {
            const t = 1 - pondDist / 3.6;
            h -= t * t * (3 - 2 * t) * 1.35;
        }

        // Suavização leve na área das estações laterais para não afundarem no lago
        const dMix = Math.hypot(x - STATION_MIXER.x, z - STATION_MIXER.z);
        if (dMix < 2.2) {
            const t = 1 - dMix / 2.2;
            h = h * (1 - t * 0.65) + Math.max(0.18, h) * (t * 0.65);
        }
        const dBrk = Math.hypot(x - STATION_BRICK.x, z - STATION_BRICK.z);
        if (dBrk < 2.0) {
            const t = 1 - dBrk / 2.0;
            h = h * (1 - t * 0.65) + Math.max(0.18, h) * (t * 0.65);
        }

        // Aplica terraplanagem feita pelo jogador (Nivelar)
        const lw = sampleLevelWeight(x, z);
        if (lw > 0.001) {
            h = h * (1 - lw) + PLATEAU_Y * lw;
        }

        return Math.max(-0.95, Math.min(2.2, h));
    }

    function createNoiseTexture(hex, variation, repeat = 1) {
        const c = document.createElement('canvas');
        c.width = c.height = 256;
        const ctx = c.getContext('2d');
        const base = new THREE.Color(hex);
        const img = ctx.createImageData(256, 256);
        for (let i = 0; i < img.data.length; i += 4) {
            const n = (Math.random() - 0.5) * variation;
            img.data[i] = Math.min(255, Math.max(0, base.r * 255 + n));
            img.data[i + 1] = Math.min(255, Math.max(0, base.g * 255 + n));
            img.data[i + 2] = Math.min(255, Math.max(0, base.b * 255 + n));
            img.data[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(repeat, repeat);
        return tex;
    }

    function createWoodGrainTexture(baseHex, darkHex) {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = baseHex;
        ctx.fillRect(0, 0, 512, 256);
        ctx.strokeStyle = darkHex;
        ctx.globalAlpha = 0.34;
        for (let y = 0; y < 256; y += 5) {
            ctx.beginPath();
            ctx.lineWidth = 1.5 + Math.random() * 2;
            ctx.moveTo(0, y);
            for (let x = 0; x <= 512; x += 32) {
                ctx.lineTo(x, y + Math.sin(x * 0.02 + y * 0.1) * 4);
            }
            ctx.stroke();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
    }

    function createBrickTextures(baseHex, grooveHex) {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 128;
        const ctx = c.getContext('2d');
        ctx.fillStyle = baseHex;
        ctx.fillRect(0, 0, 256, 128);
        const img = ctx.getImageData(0, 0, 256, 128);
        for (let i = 0; i < img.data.length; i += 4) {
            const n = (Math.random() - 0.5) * 20;
            img.data[i] = Math.min(255, Math.max(0, img.data[i] + n));
            img.data[i + 1] = Math.min(255, Math.max(0, img.data[i + 1] + n));
            img.data[i + 2] = Math.min(255, Math.max(0, img.data[i + 2] + n));
        }
        ctx.putImageData(img, 0, 0);
        ctx.fillStyle = grooveHex;
        ctx.globalAlpha = 0.25;
        for (let y = 18; y < 115; y += 22) ctx.fillRect(8, y, 240, 6);
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = '#2b1208';
        ctx.lineWidth = 8;
        ctx.strokeRect(0, 0, 256, 128);
        return { colorTex: new THREE.CanvasTexture(c), bumpTex: new THREE.CanvasTexture(c) };
    }

    function createRoofTileTextures() {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#8f4024';
        ctx.fillRect(0, 0, 256, 256);
        for (let x = 0; x < 256; x += 24) {
            const grad = ctx.createLinearGradient(x, 0, x + 24, 0);
            grad.addColorStop(0, '#5e2714');
            grad.addColorStop(0.45, '#a84f2f');
            grad.addColorStop(1, '#5e2714');
            ctx.fillStyle = grad;
            ctx.fillRect(x, 0, 24, 256);
        }
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        for (let y = 0; y < 256; y += 32) ctx.fillRect(0, y, 256, 3);
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(3, 2);
        return tex;
    }

    function createProceduralTerrainMesh() {
        if (terrainMesh) dioramaGroup.remove(terrainMesh);
        if (terrainSkirtMesh) dioramaGroup.remove(terrainSkirtMesh);

        const SEG = 60;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array((SEG + 1) * (SEG + 1) * 3);
        const colors = new Float32Array((SEG + 1) * (SEG + 1) * 3);
        const indices = [];

        // Mapeamento elíptico de quadrado [-1,1]^2 para disco perfeito de raio DIORAMA_R
        for (let iz = 0; iz <= SEG; iz++) {
            const v = (iz / SEG) * 2 - 1;
            for (let ix = 0; ix <= SEG; ix++) {
                const u = (ix / SEG) * 2 - 1;
                const dx = u * Math.sqrt(Math.max(0, 1 - (v * v) * 0.5));
                const dz = v * Math.sqrt(Math.max(0, 1 - (u * u) * 0.5));
                const wx = dx * DIORAMA_R;
                const wz = dz * DIORAMA_R;
                const idx = (iz * (SEG + 1) + ix) * 3;
                positions[idx] = wx;
                positions[idx + 1] = 0;
                positions[idx + 2] = wz;
            }
        }

        for (let iz = 0; iz < SEG; iz++) {
            for (let ix = 0; ix < SEG; ix++) {
                const a = iz * (SEG + 1) + ix;
                const b = a + 1;
                const c = a + (SEG + 1);
                const d = c + 1;
                indices.push(a, c, b, b, c, d);
            }
        }

        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.setIndex(indices);

        const mat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.94,
            metalness: 0.02,
            flatShading: false
        });

        terrainMesh = new THREE.Mesh(geo, mat);
        terrainMesh.receiveShadow = true;
        terrainMesh.castShadow = true;
        dioramaGroup.add(terrainMesh);

        // Saia lateral de corte geológico fechando a borda do disco até a base de ardósia
        const rimCount = 96;
        const skirtGeo = new THREE.BufferGeometry();
        const sPos = new Float32Array((rimCount + 1) * 2 * 3);
        const sIdx = [];
        for (let i = 0; i <= rimCount; i++) {
            const ang = (i / rimCount) * Math.PI * 2;
            const rx = Math.cos(ang) * DIORAMA_R;
            const rz = Math.sin(ang) * DIORAMA_R;
            const topIdx = i * 6;
            sPos[topIdx] = rx; sPos[topIdx + 1] = 0; sPos[topIdx + 2] = rz;
            sPos[topIdx + 3] = rx; sPos[topIdx + 4] = -1.0; sPos[topIdx + 5] = rz;
            if (i < rimCount) {
                const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
                sIdx.push(a, b, c, b, d, c);
            }
        }
        skirtGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
        skirtGeo.setIndex(sIdx);
        terrainSkirtMesh = new THREE.Mesh(
            skirtGeo,
            new THREE.MeshStandardMaterial({ color: 0x3f3327, roughness: 0.96, side: THREE.DoubleSide })
        );
        terrainSkirtMesh.receiveShadow = true;
        dioramaGroup.add(terrainSkirtMesh);

        updateTerrainGeometry();
    }

    const cGrassDark = new THREE.Color('#344528');

    const cRockSlope = new THREE.Color('#52544f');
    const tmpColor = new THREE.Color();

    function updateTerrainGeometry() {
        if (!terrainMesh) return;
        const pos = terrainMesh.geometry.attributes.position;
        const col = terrainMesh.geometry.attributes.color;

        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const z = pos.getZ(i);
            const h = getTerrainHeight(x, z);
            pos.setY(i, h);

            const lw = sampleLevelWeight(x, z);
            if (h < WATER_LEVEL + 0.08) {
                const t = Math.max(0, Math.min(1, (WATER_LEVEL + 0.08 - h) / 0.45));
                tmpColor.copy(cEarthPad).lerp(cPondBed, t);
            } else {
                const n = valueNoise2D(x * 0.6, z * 0.6, state.seed + 77);
                tmpColor.copy(cGrassDark).lerp(cGrassLight, n);
                if (h > 1.05) tmpColor.lerp(cRockSlope, Math.min(0.6, (h - 1.05) * 0.7));
                if (lw > 0.05) tmpColor.lerp(cEarthPad, Math.min(0.92, lw * 1.15));
            }
            col.setXYZ(i, tmpColor.r, tmpColor.g, tmpColor.b);
        }
        pos.needsUpdate = true;
        col.needsUpdate = true;
        terrainMesh.geometry.computeVertexNormals();

        // Atualiza altura da saia lateral
        const sPos = terrainSkirtMesh.geometry.attributes.position;
        for (let i = 0; i < sPos.count; i += 2) {
            const rx = sPos.getX(i);
            const rz = sPos.getZ(i);
            sPos.setY(i, Math.max(-0.98, getTerrainHeight(rx, rz)));
        }
        sPos.needsUpdate = true;
        terrainSkirtMesh.geometry.computeVertexNormals();

        // Atualiza grade de construção acompanhando o terreno
        updateTerrainGridLines();
    }

    // Grade de construção 10x10 que se adapta dinamicamente ao relevo
    let terrainGridLines = null;
    function updateTerrainGridLines() {
        if (terrainGridLines) scene.remove(terrainGridLines);
        if (state.phase !== 1) return;

        const pts = [];
        const half = GRID_SIZE / 2;
        const step = 0.25;
        for (let gx = 0; gx <= GRID_SIZE; gx++) {
            const wx = gx - half;
            for (let s = 0; s < GRID_SIZE / step; s++) {
                const z1 = -half + s * step + GRID_OFFSET_Z;
                const z2 = z1 + step;
                pts.push(wx, getTerrainHeight(wx, z1) + 0.03, z1);
                pts.push(wx, getTerrainHeight(wx, z2) + 0.03, z2);
            }
        }
        for (let gz = 0; gz <= GRID_SIZE; gz++) {
            const wz = gz - half + GRID_OFFSET_Z;
            for (let s = 0; s < GRID_SIZE / step; s++) {
                const x1 = -half + s * step;
                const x2 = x1 + step;
                pts.push(x1, getTerrainHeight(x1, wz) + 0.03, wz);
                pts.push(x2, getTerrainHeight(x2, wz) + 0.03, wz);
            }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        terrainGridLines = new THREE.LineSegments(
            geo,
            new THREE.LineBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.28 })
        );
        scene.add(terrainGridLines);
    }

    // Árvores realistas (pinheiros e copas naturais dessaturadas) + Nuvem Gaussian Splatting atmosférica
    function createRealisticTree(x, z, scale, isConifer) {
        const y = getTerrainHeight(x, z);
        if (y < WATER_LEVEL + 0.12) return;

        const tree = new THREE.Group();
        tree.position.set(x, y - 0.05, z);

        const trunkH = (isConifer ? 1.85 : 1.6) * scale;
        const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.07 * scale, 0.14 * scale, trunkH, 7),
            matTrunkWood
        );
        trunk.position.y = trunkH / 2;
        trunk.castShadow = true;
        tree.add(trunk);

        const greens = ['#263820', '#314628', '#3c522f', '#1f2e1a'];
        if (isConifer) {
            for (let i = 0; i < 4; i++) {
                const mat = new THREE.MeshStandardMaterial({ color: greens[i % greens.length], roughness: 0.94, flatShading: true });
                const cone = new THREE.Mesh(new THREE.ConeGeometry((0.92 - i * 0.18) * scale, (1.12 - i * 0.1) * scale, 7), mat);
                cone.position.y = trunkH * 0.55 + i * 0.5 * scale;
                cone.rotation.y = i * 0.8;
                cone.castShadow = true;
                cone.receiveShadow = true;
                tree.add(cone);
            }
        } else {
            for (let i = 0; i < 14; i++) {
                const ang = (i / 14) * Math.PI * 2 + (i * 0.37);
                const rad = (i < 3 ? 0.14 : 0.34 + (i % 3) * 0.16) * scale;
                const py = trunkH + (0.15 + (i % 4) * 0.22) * scale;
                const mat = new THREE.MeshStandardMaterial({ color: greens[i % greens.length], roughness: 0.95, flatShading: true });
                const clump = new THREE.Mesh(new THREE.IcosahedronGeometry((0.26 + (i % 3) * 0.07) * scale, 0), mat);
                clump.position.set(Math.cos(ang) * rad, py, Math.sin(ang) * rad);
                clump.scale.set(1.25, 0.72, 1.15);
                clump.castShadow = true;
                clump.receiveShadow = true;
                tree.add(clump);
            }
        }
        natureGroup.add(tree);
    }

    function populateNatureAndSplats() {
        while (natureGroup.children.length > 0) natureGroup.remove(natureGroup.children[0]);
        while (splatGroup.children.length > 0) splatGroup.remove(splatGroup.children[0]);

        const s = state.seed;
        // Posiciona árvores apenas fora da zona central de construção e fora do lago
        for (let i = 0; i < 14; i++) {
            const ang = (i / 14) * Math.PI * 2 + hash2D(i, 11, s) * 0.35;
            const dist = 6.2 + hash2D(i, 22, s) * 2.2;
            const tx = Math.cos(ang) * dist;
            const tz = Math.sin(ang) * dist;
            if (Math.hypot(tx - STATION_MIXER.x, tz - STATION_MIXER.z) < 2.2) continue;
            if (Math.hypot(tx - STATION_BRICK.x, tz - STATION_BRICK.z) < 2.0) continue;
            if (Math.hypot(tx - STATION_REBAR.x, tz - STATION_REBAR.z) < 1.9) continue;
            const scale = 0.85 + hash2D(i, 33, s) * 0.55;
            createRealisticTree(tx, tz, scale, hash2D(i, 44, s) > 0.45);
        }

        // Pedras naturais ao redor do lago e encostas
        for (let i = 0; i < 16; i++) {
            const ang = hash2D(i, 55, s) * Math.PI * 2;
            const dist = 4.6 + hash2D(i, 66, s) * 3.8;
            const rx = Math.cos(ang) * dist;
            const rz = Math.sin(ang) * dist;
            const ry = getTerrainHeight(rx, rz);
            if (Math.abs(rx) < 4.8 && rz > -5.5 && rz < 3.6) continue;
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22 + hash2D(i, 77, s) * 0.25, 0), matStone);
            rock.position.set(rx, ry + 0.03, rz);
            rock.scale.set(1.3, 0.65, 1.1);
            rock.rotation.set(i, i * 0.7, 0);
            rock.castShadow = true;
            rock.receiveShadow = true;
            natureGroup.add(rock);
        }

        // Nuvem volumétrica sutil estilo Gaussian Splatting nas bordas e folhagens
        const count = 900;
        const pos = new Float32Array(count * 3);
        const cols = new Float32Array(count * 3);
        const palette = [new THREE.Color('#2d4226'), new THREE.Color('#3f5432'), new THREE.Color('#64748b'), new THREE.Color('#475569')];
        for (let i = 0; i < count; i++) {
            const ang = hash2D(i, 81, s) * Math.PI * 2;
            const dist = 6.8 + hash2D(i, 82, s) * 2.7;
            const px = Math.cos(ang) * dist;
            const pz = Math.sin(ang) * dist;
            const py = getTerrainHeight(px, pz) + 0.2 + hash2D(i, 83, s) * 2.4;
            pos[i * 3] = px; pos[i * 3 + 1] = py; pos[i * 3 + 2] = pz;
            const c = palette[i % palette.length];
            cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));

        const sc = document.createElement('canvas');
        sc.width = sc.height = 64;
        const sctx = sc.getContext('2d');
        const grd = sctx.createRadialGradient(32, 32, 2, 32, 32, 30);
        grd.addColorStop(0, 'rgba(255,255,255,0.45)');
        grd.addColorStop(0.5, 'rgba(255,255,255,0.14)');
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        sctx.fillStyle = grd;
        sctx.fillRect(0, 0, 64, 64);

        const pts = new THREE.Points(geo, new THREE.PointsMaterial({
            size: 1.15,
            map: new THREE.CanvasTexture(sc),
            vertexColors: true,
            transparent: true,
            depthWrite: false,
            opacity: 0.42
        }));
        splatGroup.add(pts);
    }

    function createPhysicalSupply(type, x, y, z) {
        const g = new THREE.Group();
        g.position.set(x, y, z);
        let mesh;
        if (type === 'sand') {
            mesh = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.2, 0.34), new THREE.MeshStandardMaterial({ map: createNoiseTexture('#cfa05b', 25), roughness: 0.92 }));
            mesh.position.y = 0.1;
        } else if (type === 'cement') {
            mesh = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.2, 0.36), new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.85 }));
            mesh.position.y = 0.1;
        } else if (type === 'water') {
            mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.4, 14), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.35 }));
            mesh.position.y = 0.2;
        } else if (type === 'bucket') {
            mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.16, 0.32, 14), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 }));
            mesh.position.y = 0.16;
            bucketConcreteFill = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.18, 0.05, 14), matConcrete);
            bucketConcreteFill.position.y = 0.3;
            bucketConcreteFill.visible = false;
            g.add(bucketConcreteFill);
        }
        mesh.castShadow = true; mesh.receiveShadow = true;
        g.add(mesh);

        const item = { type, mesh: g, vy: 0, grounded: false, consumed: false };
        g.traverse(c => c.userData.physicalSupply = item);
        physicsSuppliesGroup.add(g);
        state.draggableSupplies.push(item);
        if (type === 'bucket') bucketObj = item;
        return item;
    }

    window.restockSupplies = function() {
        state.draggableSupplies = state.draggableSupplies.filter(s => {
            if (s.type === 'bucket') return true;
            physicsSuppliesGroup.remove(s.mesh);
            return false;
        });
        const ix = STATION_MIXER.x, iz = STATION_MIXER.z;
        const baseY = getTerrainHeight(ix - 1.15, iz);
        createPhysicalSupply('sand', ix - 1.15, baseY + 0.8, iz - 0.45);
        createPhysicalSupply('sand', ix - 1.15, baseY + 1.15, iz - 0.45);
        createPhysicalSupply('sand', ix - 1.15, baseY + 1.5, iz - 0.45);
        createPhysicalSupply('cement', ix - 1.15, baseY + 0.9, iz + 0.18);
        createPhysicalSupply('water', ix - 1.15, baseY + 0.9, iz + 0.72);

            createPhysicalSupply('bucket', ix + 0.95, getTerrainHeight(ix + 0.95, iz + 0.6) + 0.6, iz + 0.6);

        showToast('Insumos entregues na masseira! Arraste ou clique neles para jogar na caixa.', '🚚');
    };

    function worldToGrid(pt) {
        const half = GRID_SIZE / 2;
        return {
            gx: Math.max(0, Math.min(GRID_SIZE - 1, Math.floor(pt.x + half))),
            gz: Math.max(0, Math.min(GRID_SIZE - 1, Math.floor((pt.z - GRID_OFFSET_Z) + half)))
        };
    }

    function gridToWorldCenter(gx, gz) {
        const half = GRID_SIZE / 2;
        return { x: gx - half + 0.5, z: gz - half + 0.5 + GRID_OFFSET_Z };
    }

    function rebuildBlueprintFromCells() {
        while (blueprintGroup.children.length > 0) blueprintGroup.remove(blueprintGroup.children[0]);
        state.columns = [];
        state.walls = [];
        state.floorTiles = [];

        if (state.occupiedCells.size > 0) {
            // Calcula altura base uniforme da casa (média das células ocupadas)
            let sumH = 0;
            state.occupiedCells.forEach(k => {
                const [gx, gz] = k.split(',').map(Number);
                const c = gridToWorldCenter(gx, gz);
                sumH += getTerrainHeight(c.x, c.z);
            });
            state.houseBaseY = Math.max(WATER_LEVEL + 0.28, sumH / state.occupiedCells.size);
        }

        const half = GRID_SIZE / 2;
        const wallMap = new Map();
        const vConn = new Map();

        function regVertex(vx, vz, ori) {
            const k = `${vx.toFixed(2)},${vz.toFixed(2)}`;
            if (!vConn.has(k)) vConn.set(k, { vx, vz, hasH: false, hasV: false, count: 0 });
            const info = vConn.get(k);
            if (ori === 'H') info.hasH = true;
            if (ori === 'V') info.hasV = true;
            info.count++;
        }

        state.occupiedCells.forEach(key => {
            const [gx, gz] = key.split(',').map(Number);
            const c = gridToWorldCenter(gx, gz);
            const ty = Math.max(state.houseBaseY, getTerrainHeight(c.x, c.z)) + 0.04;

            const tile = new THREE.Mesh(
                new THREE.PlaneGeometry(0.95, 0.95),
                new THREE.MeshBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.30 })
            );
            tile.rotation.x = -Math.PI / 2;
            tile.position.set(c.x, ty, c.z);
            blueprintGroup.add(tile);

            state.floorTiles.push({ gx, gz, x: c.x, z: c.z, concreted: false });

            const nb = [
                { dx: 0, dz: -1, x1: gx, z1: gz, x2: gx + 1, z2: gz, ori: 'H' },
                { dx: 0, dz: 1,  x1: gx, z1: gz + 1, x2: gx + 1, z2: gz + 1, ori: 'H' },
                { dx: -1, dz: 0, x1: gx, z1: gz, x2: gx, z2: gz + 1, ori: 'V' },
                { dx: 1, dz: 0,  x1: gx + 1, z1: gz, x2: gx + 1, z2: gz + 1, ori: 'V' }
            ];
            nb.forEach(n => {
                if (!state.occupiedCells.has(`${gx + n.dx},${gz + n.dz}`)) {
                    const id = `${n.x1},${n.z1}-${n.x2},${n.z2}`;
                    if (!wallMap.has(id)) {
                        const wx1 = n.x1 - half, wz1 = n.z1 - half + GRID_OFFSET_Z;
                        const wx2 = n.x2 - half, wz2 = n.z2 - half + GRID_OFFSET_Z;
                        wallMap.set(id, { id, x1: wx1, z1: wz1, x2: wx2, z2: wz2, ori: n.ori, opening: null, slots: [] });
                        regVertex(wx1, wz1, n.ori);
                        regVertex(wx2, wz2, n.ori);
                    }
                }
            });
        });

        vConn.forEach(v => {
            if ((v.hasH && v.hasV) || v.count === 1) {
                const ty = getTerrainHeight(v.vx, v.vz);
                const m = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.18, 0.28), new THREE.MeshBasicMaterial({ color: 0xf59e0b }));
                m.position.set(v.vx, Math.max(state.houseBaseY, ty) + 0.09, v.vz);
                blueprintGroup.add(m);
                state.columns.push({ x: v.vx, z: v.vz, terrainY: ty, dug: false, hasRebar: false, hasFormwork: false, concreted: false });
            }
        });

        wallMap.forEach(seg => {
            const mx = (seg.x1 + seg.x2) / 2, mz = (seg.z1 + seg.z2) / 2;
            const geo = seg.ori === 'H' ? new THREE.BoxGeometry(0.94, 0.16, 0.16) : new THREE.BoxGeometry(0.16, 0.16, 0.94);
            const wp = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.85 }));
            wp.position.set(mx, state.houseBaseY + 0.1, mz);
            wp.userData = { wallSegment: seg };
            blueprintGroup.add(wp);
            seg.meshPreview = wp;
            state.walls.push(seg);
        });

        renderMurosAndStairsBlueprint();
    }

    function renderMurosAndStairsBlueprint() {
        while (muroStairGroup.children.length > 0) muroStairGroup.remove(muroStairGroup.children[0]);

        state.muros.forEach(mu => {
            const ty = getTerrainHeight(mu.x, mu.z);
            if (mu.built) {
                const geo = mu.ori === 'H' ? new THREE.BoxGeometry(1.0, 1.05, 0.22) : new THREE.BoxGeometry(0.22, 1.05, 1.0);
                const wallM = new THREE.Mesh(geo, matConcreteDark);
                wallM.position.set(mu.x, ty + 0.45, mu.z);
                wallM.castShadow = true; wallM.receiveShadow = true;
                wallM.userData = { muroRef: mu };
                muroStairGroup.add(wallM);

                // Pilarzinho de amarração no muro
                const post = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.15, 0.28), matConcrete);
                post.position.set(mu.x + (mu.ori === 'H' ? 0.48 : 0), ty + 0.5, mu.z + (mu.ori === 'V' ? 0.48 : 0));
                post.castShadow = true;
                muroStairGroup.add(post);
                mu.mesh = wallM;
            } else {
                const geo = mu.ori === 'H' ? new THREE.BoxGeometry(0.96, 0.42, 0.2) : new THREE.BoxGeometry(0.2, 0.42, 0.96);
                const prev = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.45 }));
                prev.position.set(mu.x, ty + 0.21, mu.z);
                prev.userData = { muroRef: mu };
                muroStairGroup.add(prev);
                mu.mesh = prev;
            }
        });

        state.stairs.forEach(st => {
            const ty = getTerrainHeight(st.x, st.z);
            const group = new THREE.Group();
            group.position.set(st.x, ty, st.z);
            const steps = 4;
            const totalH = Math.max(0.32, Math.abs(state.houseBaseY - ty) + 0.14);
            for (let i = 0; i < steps; i++) {
                const sh = (totalH / steps) * (i + 1);
                const mat = st.built ? matConcrete : new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.42 });
                const stepMesh = new THREE.Mesh(new THREE.BoxGeometry(0.92, sh, 0.24), mat);
                stepMesh.position.set(0, sh / 2 - 0.05, 0.36 - i * 0.24);
                stepMesh.castShadow = st.built;
                stepMesh.receiveShadow = true;
                stepMesh.userData = { stairRef: st };
                group.add(stepMesh);
            }
            muroStairGroup.add(group);
            st.meshGroup = group;
        });
    }

    function toggleWallOpening(seg, type) {
        if (seg.opening === type) {
            seg.opening = null;
            seg.meshPreview.material.color.setHex(0xe2e8f0);
            seg.meshPreview.scale.y = 1;
        } else {
            seg.opening = type;
            seg.meshPreview.material.color.setHex(type === 'door' ? 0x10b981 : 0x38bdf8);
            seg.meshPreview.scale.y = type === 'door' ? 2.5 : 1.7;
        }
    }

    window.loadPresetHouse = function() {
        // Nivela automaticamente o platô central da casa
        for (let x = -3.0; x <= 3.0; x += 0.9) {
            for (let z = -3.4; z <= 1.6; z += 0.9) {
                paintLevelWeight(x, z, 1.9, 1.0);
            }
        }
        updateTerrainGeometry();

        state.occupiedCells.clear();
        state.muros = [];
        state.stairs = [];

        // Casa em L (4x3 + anexo 2x2)
        for (let x = 2; x <= 5; x++) {
            for (let z = 3; z <= 5; z++) state.occupiedCells.add(`${x},${z}`);
        }
        for (let x = 6; x <= 7; x++) {
            for (let z = 3; z <= 4; z++) state.occupiedCells.add(`${x},${z}`);
        }

        // Muro de divisa/arrimo no fundo/lateral do terreno
        for (let gx = 1; gx <= 7; gx++) {
            const c = gridToWorldCenter(gx, 1);
            state.muros.push({ x: c.x, z: c.z - 0.45, ori: 'H', built: false });
        }

        // Escada externa de acesso na frente da porta
        const stairPos = gridToWorldCenter(3, 6);
        state.stairs.push({ x: stairPos.x, z: stairPos.z, built: false });

        rebuildBlueprintFromCells();

        // Marca porta na frente e janelas laterais
        const frontWall = state.walls.find(w => w.ori === 'H' && w.z1 > 0.1 && Math.abs((w.x1 + w.x2) / 2 - stairPos.x) < 0.3);
        if (frontWall) toggleWallOpening(frontWall, 'door');
        const win1 = state.walls.find(w => w.ori === 'H' && w.z1 > 0.1 && w !== frontWall);
        if (win1) toggleWallOpening(win1, 'window');
        const win2 = state.walls.find(w => w.ori === 'V' && w.x1 > 1.5);
        if (win2) toggleWallOpening(win2, 'window');

        SoundFX.playDirtShovel();
        showToast('Planta modelo em L carregada com platô nivelado, muro e escada!', '✨');
    };

        syncPhaseUI();
        buildFoundation3D();
        selectTool('dig');
        showToast(`Fase 2: Cave as ${state.columns.length} sapatas nos cantos!`, '⛏️');
    };

    function buildFoundation3D() {
        while (foundationGroup.children.length > 0) foundationGroup.remove(foundationGroup.children[0]);
        state.columns.forEach(col => {
            col.terrainY = getTerrainHeight(col.x, col.z);
            const g = new THREE.Group();
            g.position.set(col.x, col.terrainY, col.z);

            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.18, 0.31, 4),
                new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.rotation.z = Math.PI / 4;
            ring.position.y = 0.04;
            g.add(ring);

            const hit = new THREE.Mesh(new THREE.BoxGeometry(0.68, 2.5, 0.68), new THREE.MeshBasicMaterial({ visible: false }));
            hit.position.y = 1.1;
            hit.userData = { column: col };
            g.add(hit);

            col.meshGroup = g;
            col.ringMesh = ring;
            col.hitbox = hit;
            foundationGroup.add(g);
        });
    }

    function createRebarCageMesh(height = 2.05) {
        const cage = new THREE.Group();
        const offsets = [[-0.06, -0.06], [0.06, -0.06], [-0.06, 0.06], [0.06, 0.06]];
        offsets.forEach(([ox, oz]) => {
            const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, height, 7), matSteel);
            bar.position.set(ox, height / 2, oz);
            bar.castShadow = true;
            cage.add(bar);
        });
        for (let y = 0.25; y < height - 0.15; y += 0.42) {
            const st = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, 0.15), matSteel);
            st.position.y = y;
            cage.add(st);
        }
        const grab = new THREE.Mesh(new THREE.BoxGeometry(0.45, height, 0.45), new THREE.MeshBasicMaterial({ visible: false }));
        grab.position.y = height / 2;
        cage.add(grab);
        return cage;
    }

    window.spawnFallingRebars = function() {
        const needed = state.columns.filter(c => !c.hasRebar).length - state.looseRebars.filter(r => !r.installed).length;
        if (needed <= 0) {
            showToast('Todas as armaduras necessárias já estão no canteiro!', '⛓️');
            return;
        }
        for (let i = 0; i < needed; i++) {
            const cage = createRebarCageMesh();
            const dx = STATION_REBAR.x - 0.6 + (i % 3) * 0.58;
            const dz = STATION_REBAR.z - 0.3 + Math.floor(i / 3) * 0.58;
            const ty = getTerrainHeight(dx, dz);
            cage.position.set(dx, ty + 3.0 + i * 0.45, dz);
            cage.rotation.z = Math.PI / 2 - 0.22;
            cage.rotation.y = (Math.random() - 0.5) * 0.6;
            const rObj = { mesh: cage, vy: 0, grounded: false, installed: false };
            cage.traverse(c => c.userData.rebarObj = rObj);
            looseRebarsGroup.add(cage);
            state.looseRebars.push(rObj);
        }
        SoundFX.playMetalClang();
        showToast(`${needed} armaduras entregues! Arraste cada uma para dentro das sapatas.`, '⛓️');
    };

    function attachWoodFormworkToColumn(col) {
        if (col.hasFormwork) return;
        col.hasFormwork = true;
        const topY = state.houseBaseY + WALL_HEIGHT + 0.14;
        const h = Math.max(1.85, topY - col.terrainY);
        const fw = new THREE.Group();
        const w = 0.28, t = 0.03;
        const p1 = new THREE.Mesh(new THREE.BoxGeometry(w, h, t), matFormwork); p1.position.set(0, h / 2, w / 2);
        const p2 = p1.clone(); p2.position.set(0, h / 2, -w / 2);
        const p3 = new THREE.Mesh(new THREE.BoxGeometry(t, h, w), matFormwork); p3.position.set(w / 2, h / 2, 0);
        const p4 = p3.clone(); p4.position.set(-w / 2, h / 2, 0);
        [p1, p2, p3, p4].forEach(p => { p.castShadow = true; p.receiveShadow = true; fw.add(p); });
        col.formworkMesh = fw;
        col.meshGroup.add(fw);
    }

    function concreteColumn(col) {
        if (col.concreted) return;
        col.concreted = true;
        if (col.formworkMesh) col.formworkMesh.visible = false;
        const topY = state.houseBaseY + WALL_HEIGHT + 0.14;
        const h = Math.max(1.85, topY - col.terrainY + 0.15);
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.24, h, 0.24), matConcrete);
        pillar.position.y = h / 2 - 0.15;
        pillar.castShadow = true; pillar.receiveShadow = true;
        col.pillarMesh = pillar;
        col.meshGroup.add(pillar);
        col.ringMesh.visible = false;
        spawnBurst(col.x, col.terrainY + 1.1, col.z, 0x94a3b8, 10);
        SoundFX.playMortarSquish();
    }

        if (pending > 0) {

    window.spawnBrickPallet = function() {
        const isStd = state.brickType === 'standard';
        const mat = isStd ? matBrickCeramic : matBrickBlock;
        const geo = isStd ? new THREE.BoxGeometry(0.42, 0.22, 0.17) : new THREE.BoxGeometry(0.42, 0.34, 0.17);
        const px = STATION_BRICK.x, pz = STATION_BRICK.z;
        const py = getTerrainHeight(px, pz);

        const palletWood = new THREE.Mesh(new THREE.BoxGeometry(1.38, 0.08, 1.38), matWood);
        palletWood.position.set(px, py + 0.04, pz);
        palletWood.receiveShadow = true;
        looseBricksGroup.add(palletWood);

        let count = 0;
        for (let layer = 0; layer < 4; layer++) {
            for (let r = 0; r < 2; r++) {
                for (let c = 0; c < 3; c++) {
                    const bx = px - 0.42 + c * 0.42;
                    const bz = pz - 0.2 + r * 0.4;
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(bx, py + 0.5 + layer * 0.32 + count * 0.02, bz);
                    mesh.castShadow = true; mesh.receiveShadow = true;
                    const bObj = { mesh, vy: 0, grounded: false, placed: false };
                    mesh.userData.looseBrick = bObj;
                    looseBricksGroup.add(mesh);
                    state.looseBricks.push(bObj);
                    count++;
                }
            }
        }
        SoundFX.playBrickClack();
        showToast('Palete com 24 tijolos entregue! Clique em um tijolo e depois na parede.', '🧱');
    };

    function createCutoutPlasterGroup(wall) {
        // Constrói o reboco RECORTADO preservando totalmente os vãos de porta e janela!
        const grp = new THREE.Group();
        const midX = (wall.x1 + wall.x2) / 2;
        const midZ = (wall.z1 + wall.z2) / 2;
        const baseY = state.houseBaseY + 0.14;
        const pMat = new THREE.MeshStandardMaterial({
            map: createNoiseTexture('#d6d3d1', 10),
            color: 0xd6d3d1,
            roughness: 0.90
        });
        wall.plasterMat = pMat;

        const thick = 0.22;
        const totalW = 1.01;
        const H = WALL_HEIGHT;

        function addPanel(localAlong, localY, panelW, panelH) {
            const geo = wall.ori === 'H'
                ? new THREE.BoxGeometry(panelW, panelH, thick)
                : new THREE.BoxGeometry(thick, panelH, panelW);
            const m = new THREE.Mesh(geo, pMat);
            m.position.set(
                wall.ori === 'H' ? midX + localAlong : midX,
                baseY + localY,
                wall.ori === 'V' ? midZ + localAlong : midZ
            );
            m.castShadow = true;
            m.receiveShadow = true;
            m.userData = { finishWall: wall };
            grp.add(m);
        }

        if (wall.opening === 'door') {
            // Vão da porta: largura 0.62, altura 1.45 (do chão até a verga)
            addPanel(-0.4025, H / 2, 0.205, H);               // Lateral esquerda
            addPanel(0.4025, H / 2, 0.205, H);                // Lateral direita
            addPanel(0, 1.45 + (H - 1.45) / 2, 0.62, H - 1.45); // Acima da verga
        } else if (wall.opening === 'window') {
            // Vão da janela: largura 0.64, altura de 0.62 até 1.45
            addPanel(-0.4075, H / 2, 0.195, H);               // Lateral esquerda
            addPanel(0.4075, H / 2, 0.195, H);                // Lateral direita
            addPanel(0, 0.31, 0.64, 0.62);                    // Peitoril inferior
            addPanel(0, 1.45 + (H - 1.45) / 2, 0.64, H - 1.45); // Verga superior
        } else {
            addPanel(0, H / 2, totalW, H);
        }

        grp.visible = false;
        return grp;
    }

    function createOpeningFixture(wall) {
        const grp = new THREE.Group();
        const midX = (wall.x1 + wall.x2) / 2;
        const midZ = (wall.z1 + wall.z2) / 2;
        const baseY = state.houseBaseY + 0.14;
        grp.position.set(midX, baseY, midZ);
        if (wall.ori === 'V') grp.rotation.y = Math.PI / 2;

        if (wall.opening === 'door') {
            // Batente + Folha de Madeira + Maçaneta metálica
            const frameTop = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.05, 0.23), matTrunkWood);
            frameTop.position.set(0, 1.425, 0);
            const frameL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.45, 0.23), matTrunkWood);
            frameL.position.set(-0.295, 0.725, 0);
            const frameR = frameL.clone(); frameR.position.x = 0.295;
            const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.54, 1.40, 0.055), matDoorWood);
            leaf.position.set(0, 0.70, 0);
            leaf.castShadow = true;
            const handle1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.025, 0.09), matSteel);
            handle1.position.set(0.19, 0.68, 0);
            grp.add(frameTop, frameL, frameR, leaf, handle1);
        } else if (wall.opening === 'window') {
            // Esquadria de alumínio preto + vidro semi-transparente reflexivo + divisória
            const winY = 0.62 + 0.415;
            const top = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.045, 0.22), matWindowFrame);
            top.position.set(0, 1.43, 0);
            const bot = top.clone(); bot.position.y = 0.64;
            const left = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.83, 0.22), matWindowFrame);
            left.position.set(-0.298, winY, 0);
            const right = left.clone(); right.position.x = 0.298;
            const mullion = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.79, 0.06), matWindowFrame);
            mullion.position.set(0, winY, 0);
            const pane = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.77, 0.025), matGlass);
            pane.position.set(0, winY, 0);
            grp.add(top, bot, left, right, mullion, pane);
        }
        grp.visible = false;
        return grp;
    }

    function buildInteractiveWalls3D() {
        while (wallsGroup.children.length > 0) wallsGroup.remove(wallsGroup.children[0]);

        const isStd = state.brickType === 'standard';
        const numRows = isStd ? 6 : 4;
        const rowH = WALL_HEIGHT / numRows;
        const baseY = state.houseBaseY + 0.14;

        state.walls.forEach(wall => {
            const midX = (wall.x1 + wall.x2) / 2;
            const midZ = (wall.z1 + wall.z2) / 2;
            const ty = getTerrainHeight(midX, midZ);
            const baldrameH = Math.max(0.16, (state.houseBaseY + 0.14) - ty + 0.08);

            const baldGeo = wall.ori === 'H' ? new THREE.BoxGeometry(1.0, baldrameH, 0.22) : new THREE.BoxGeometry(0.22, baldrameH, 1.0);
            const baldrame = new THREE.Mesh(baldGeo, matConcrete);
            baldrame.position.set(midX, baseY - baldrameH / 2, midZ);
            baldrame.castShadow = true; baldrame.receiveShadow = true;
            wallsGroup.add(baldrame);

            wall.slots = [];
            wall.hasProp = false;
            wall.hasTopBeam = false;
            wall.isPlastered = false;
            wall.hasFixture = false;
            wall.isPainted = false;

            // Escoramento de madeira para vãos de porta/janela
            if (wall.opening === 'door' || wall.opening === 'window') {
                const propG = new THREE.Group();
                const propH = WALL_HEIGHT - rowH;
                const pOff = 0.27;
                const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, propH, 7), matWood);
                const p2 = p1.clone();
                if (wall.ori === 'H') {
                    p1.position.set(midX - pOff, baseY + propH / 2, midZ);
                    p2.position.set(midX + pOff, baseY + propH / 2, midZ);
                } else {
                    p1.position.set(midX, baseY + propH / 2, midZ - pOff);
                    p2.position.set(midX, baseY + propH / 2, midZ + pOff);
                }
                const bar = new THREE.Mesh(wall.ori === 'H' ? new THREE.BoxGeometry(0.75, 0.05, 0.14) : new THREE.BoxGeometry(0.14, 0.05, 0.75), matWood);
                bar.position.set(midX, baseY + propH, midZ);
                propG.add(p1, p2, bar);
                propG.visible = false;
                wallsGroup.add(propG);
                wall.propGroup = propG;

                const vHit = new THREE.Mesh(
                    wall.ori === 'H' ? new THREE.BoxGeometry(0.76, propH, 0.25) : new THREE.BoxGeometry(0.25, propH, 0.76),
                    new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.09, depthWrite: false })
                );
                vHit.position.set(midX, baseY + propH / 2, midZ);
                vHit.userData = { voidWall: wall };
                wallsGroup.add(vHit);
                wall.voidHitbox = vHit;
            }

            // Fiadas de tijolos com amarração intercalada
            for (let r = 0; r < numRows; r++) {
                const isDoorVoid = wall.opening === 'door' && r < numRows - 1;
                const isWindowVoid = wall.opening === 'window' && r >= Math.floor(numRows * 0.34) && r < numRows - 1;
                if (isDoorVoid || isWindowVoid) continue;

                const stagger = (r % 2 === 1) ? 0.045 : -0.045;
                for (let c = 0; c < 2; c++) {
                    const offset = (c === 0 ? -0.24 : 0.24) + stagger;
                    const bx = wall.ori === 'H' ? midX + offset : midX;
                    const bz = wall.ori === 'V' ? midZ + offset : midZ;
                    const by = baseY + r * rowH + rowH / 2;

                    const mGeo = wall.ori === 'H' ? new THREE.BoxGeometry(0.46, 0.032, 0.19) : new THREE.BoxGeometry(0.19, 0.032, 0.46);
                    const mortarBed = new THREE.Mesh(mGeo, matMortarLayer);
                    mortarBed.position.set(bx, baseY + r * rowH + 0.015, bz);
                    mortarBed.visible = false;
                    wallsGroup.add(mortarBed);

                    const bGeo = wall.ori === 'H' ? new THREE.BoxGeometry(0.46, rowH * 0.88, 0.18) : new THREE.BoxGeometry(0.18, rowH * 0.88, 0.46);
                    const isLintel = (wall.opening === 'door' || wall.opening === 'window') && r === numRows - 1;
                    const bMat = isLintel ? matConcrete : (isStd ? matBrickCeramic : matBrickBlock);
                    const bMesh = new THREE.Mesh(bGeo, bMat);
                    bMesh.position.set(bx, by + 0.015, bz);
                    bMesh.castShadow = true; bMesh.receiveShadow = true; bMesh.visible = false;
                    wallsGroup.add(bMesh);

                    const gMat = new THREE.MeshBasicMaterial({
                        color: wall.opening === 'door' ? 0x10b981 : (wall.opening === 'window' ? 0x38bdf8 : 0xf59e0b),
                        transparent: true, opacity: 0.14, depthWrite: false
                    });
                    const gMesh = new THREE.Mesh(bGeo, gMat);
                    gMesh.position.set(bx, by, bz);
                    wallsGroup.add(gMesh);

                    const slot = {
                        wallRef: wall, row: r, isLintel, x: bx, y: by, z: bz, ori: wall.ori,
                        hasMortar: false, placed: false, mortarMesh: mortarBed, mesh: bMesh, guideMesh: gMesh
                    };
                    mortarBed.userData.wallSlot = slot;
                    bMesh.userData.wallSlot = slot;
                    gMesh.userData.wallSlot = slot;
                    wall.slots.push(slot);
                }
            }

            // Cinta Superior (Fase 5)
            const tbGeo = wall.ori === 'H' ? new THREE.BoxGeometry(1.0, 0.16, 0.22) : new THREE.BoxGeometry(0.22, 0.16, 1.0);
            const tbMesh = new THREE.Mesh(tbGeo, matConcrete);
            tbMesh.position.set(midX, baseY + WALL_HEIGHT + 0.08, midZ);
            tbMesh.castShadow = true; tbMesh.visible = false;
            wallsGroup.add(tbMesh);
            wall.topBeamMesh = tbMesh;

            // Reboco Recortado (Fase 5)
            wall.plasterGroup = createCutoutPlasterGroup(wall);
            wallsGroup.add(wall.plasterGroup);

            // Esquadria de Porta / Janela (Fase 5)
            if (wall.opening) {
                wall.fixtureGroup = createOpeningFixture(wall);
                wallsGroup.add(wall.fixtureGroup);
            }

            // Hitbox para MEP / Acabamento
            const fGeo = wall.ori === 'H' ? new THREE.BoxGeometry(1.0, WALL_HEIGHT + 0.16, 0.24) : new THREE.BoxGeometry(0.24, WALL_HEIGHT + 0.16, 1.0);
            const fHit = new THREE.Mesh(fGeo, new THREE.MeshBasicMaterial({ visible: false }));
            fHit.position.set(midX, baseY + WALL_HEIGHT / 2, midZ);
            fHit.userData = { finishWall: wall };
            wallsGroup.add(fHit);
            wall.finishHitbox = fHit;
        });
    }

    function buildFloorGrid3D() {
        while (floorGroup.children.length > 0) floorGroup.remove(floorGroup.children[0]);
        state.floorTiles.forEach(ft => {
            const hit = new THREE.Mesh(
                new THREE.BoxGeometry(0.96, 0.12, 0.96),
                new THREE.MeshBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.22, depthWrite: false })
            );
            hit.position.set(ft.x, state.houseBaseY + 0.06, ft.z);
            hit.userData = { floorTile: ft };

    window.setBrickType = function(type) {
        if (state.walls.some(w => w.slots.some(s => s.placed))) {
            showToast('Não é possível trocar o bloco após iniciar a alvenaria.', '⚠️');
            return;
        }
        state.brickType = type;
        document.getElementById('brick-standard').classList.toggle('active', type === 'standard');
        document.getElementById('brick-block').classList.toggle('active', type === 'block');

    // =========================================================================
    // 11. FASE 4: INSTALAÇÕES MEP (ELÉTRICA & HIDRÁULICA COM MODO RAIO-X)

    window.toggleXRayMode = function(forceVal) {
        state.xray = (typeof forceVal === 'boolean') ? forceVal : !state.xray;
        document.getElementById('btn-xray').classList.toggle('xray-on', state.xray);

        const op = state.xray ? 0.22 : 1.0;
        [matBrickCeramic, matBrickBlock, matConcrete, matConcreteDark, matMortarLayer].forEach(m => {
            m.transparent = state.xray;
            m.opacity = op;
            m.depthWrite = !state.xray;
            m.needsUpdate = true;
        });
        state.walls.forEach(w => {
            if (w.plasterMat) {
                w.plasterMat.transparent = state.xray;
                w.plasterMat.opacity = op;
                w.plasterMat.depthWrite = !state.xray;
            }
        });
    };

        if (state.selectedBrickInHand) {
            state.selectedBrickInHand.mesh.scale.set(1, 1, 1);
            state.selectedBrickInHand = null;
        }
        brickHoverGhost.visible = false;

        toggleXRayMode(true);
        selectTool('elec');
