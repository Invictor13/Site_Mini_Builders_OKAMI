    function placeElectricalNode(wall, pt) {
        const hasQDC = state.elecNodes.some(n => n.type === 'qdc');
        const type = hasQDC ? 'outlet' : 'qdc';
        const y = Math.max(state.houseBaseY + 0.55, Math.min(state.houseBaseY + 1.45, pt.y));

        const mesh = type === 'qdc'
            ? new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.34, 0.14), matQDC)
            : new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.18, 0.12), matOutlet);
        mesh.position.set(pt.x, y, pt.z);
        if (wall.ori === 'V') mesh.rotation.y = Math.PI / 2;

        const node = { id: state.elecNodes.length, type, x: pt.x, y, z: pt.z, wallRef: wall, mesh, connected: type === 'qdc' };
        mesh.userData = { mepNode: node, mepKind: 'elec' };
        mepGroup.add(mesh);

        // Conecta automaticamente com conduíte curvo ao ponto anterior / QDC e cria ponto de luz no teto
        if (state.elecNodes.length > 0) {
            const prev = state.elecNodes[state.elecNodes.length - 1];
            const ceilingY = state.houseBaseY + WALL_HEIGHT + 0.02;
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(prev.x, prev.y, prev.z),
                new THREE.Vector3(prev.x, ceilingY, prev.z),
                new THREE.Vector3((prev.x + node.x) / 2, ceilingY + 0.04, (prev.z + node.z) / 2),
                new THREE.Vector3(node.x, ceilingY, node.z),
                new THREE.Vector3(node.x, node.y, node.z)
            ]);
            const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 22, 0.026, 6, false), matConduit);
            mepGroup.add(tube);
            state.elecConduits.push(tube);
            node.connected = true;

            // Luminária no teto do cômodo
            const lx = (prev.x + node.x) / 2, lz = (prev.z + node.z) / 2;
            const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), new THREE.MeshStandardMaterial({ color: 0xfef08a, emissive: 0x000000 }));
            bulb.position.set(lx, ceilingY - 0.06, lz);
            const pLight = new THREE.PointLight(0xffd28a, 0, 6.5);
            pLight.position.set(lx, ceilingY - 0.25, lz);
            mepGroup.add(bulb, pLight);
            state.elecLights.push({ bulb, light: pLight });
        }

        state.elecNodes.push(node);
        SoundFX.playElectricSwitch();
        showToast(type === 'qdc' ? 'Quadro de Distribuição (QDC) instalado! Agora clique para caixinhas 4x2.' : 'Caixinha 4x2 e conduíte roteados!', '⚡');
    }

    window.testElectricalSystem = function() {
        const hasQDC = state.elecNodes.some(n => n.type === 'qdc');
        if (!hasQDC || state.elecNodes.length < 2) {
            showToast('Instale o QDC e pelo menos 1 ponto elétrico conectado antes de testar!', '⚠️');
            return;
        }
        state.elecPowerOn = !state.elecPowerOn;
        SoundFX.playElectricSwitch();
        state.elecLights.forEach(l => {
            l.light.intensity = state.elecPowerOn ? 1.8 : 0;
            l.bulb.material.emissive.setHex(state.elecPowerOn ? 0xfbbf24 : 0x000000);
            l.bulb.material.emissiveIntensity = state.elecPowerOn ? 1.5 : 0;
        });
        showToast(state.elecPowerOn ? '⚡ Energia ligada! Circuito validado e luminárias acesas!' : 'Disjuntor geral desligado.', '⚡');
    };

    function placePlumbingNode(kind, pt) {
        let mesh;
        const node = { id: state.plumbNodes.length, type: kind, x: pt.x, y: pt.y, z: pt.z, connected: false };

        if (kind === 'tank') {
            mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.36, 0.56, 16), matWaterTank);
            node.y = state.houseBaseY + WALL_HEIGHT + 0.45;
            mesh.position.set(node.x, node.y, node.z);
            node.connected = true;
        } else if (kind === 'fixture') {
            mesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.14), new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 }));
            node.y = state.houseBaseY + 0.85;
            mesh.position.set(node.x, node.y, node.z);
        } else {
            // Fossa / Caixa de Gordura externa no terreno
            mesh = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.32, 0.55), matConcreteDark);
            node.y = getTerrainHeight(node.x, node.z) + 0.12;
            mesh.position.set(node.x, node.y, node.z);
            node.connected = true;
        }

        mesh.castShadow = true;
        mesh.userData = { mepNode: node, mepKind: 'plumb' };
        node.mesh = mesh;
        mepGroup.add(mesh);
        state.plumbNodes.push(node);

        // Roteia tubulação PVC marrom (água fria) da Caixa d'Água até o ponto
        const tank = state.plumbNodes.find(n => n.type === 'tank');
        const sewage = state.plumbNodes.find(n => n.type === 'sewage');

        if (kind === 'fixture' && tank) {
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(tank.x, tank.y - 0.2, tank.z),
                new THREE.Vector3(node.x, tank.y - 0.35, node.z),
                new THREE.Vector3(node.x, node.y, node.z)
            ]);
            const pipe = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, 0.03, 7, false), matPipeCold);
            mepGroup.add(pipe);
            state.plumbPipes.push(pipe);
            node.connected = true;
        }
        if ((kind === 'sewage' || kind === 'fixture') && sewage) {
            state.plumbNodes.filter(n => n.type === 'fixture' && !n.sewageLinked).forEach(fx => {
                fx.sewageLinked = true;
                const floorY = state.houseBaseY + 0.06;
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(fx.x, fx.y - 0.1, fx.z),
                    new THREE.Vector3(fx.x, floorY, fx.z),
                    new THREE.Vector3(sewage.x, floorY - 0.1, sewage.z),
                    new THREE.Vector3(sewage.x, sewage.y, sewage.z)
                ]);
                const pipe = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.045, 8, false), matPipeSewage);
                mepGroup.add(pipe);
                state.plumbPipes.push(pipe);
            });
        }

        SoundFX.playMortarSquish();
        const msg = kind === 'tank'
            ? "Caixa d'Água instalada! Clique nas paredes para pontos de água e no terreno fora para a Fossa."
            : (kind === 'fixture' ? 'Ponto hidráulico (PVC marrom) instalado!' : 'Caixa de Gordura / Fossa (PVC branco) conectada!');
        showToast(msg, '💧');
    }

    window.testPlumbingSystem = function() {
        const tank = state.plumbNodes.find(n => n.type === 'tank');
        const fixtures = state.plumbNodes.filter(n => n.type === 'fixture');
        if (!tank) {
            showToast("Instale primeiro a Caixa d'Água clicando sobre a casa!", '⚠️');

        SoundFX.playWaterRush();
        state.leakPoints = [];

        } else {

            fixtures.forEach(f => spawnBurst(f.x, f.y, f.z, 0x38bdf8, 12, 0.04));

    function buildRealGableRoofStage() {
        if (state.occupiedCells.size === 0) return;

        // Calcula bounding box exato da casa
        let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
        state.floorTiles.forEach(ft => {
            minX = Math.min(minX, ft.x - 0.5);
            maxX = Math.max(maxX, ft.x + 0.5);
            minZ = Math.min(minZ, ft.z - 0.5);
            maxZ = Math.max(maxZ, ft.z + 0.5);
        });

        const cx = (minX + maxX) / 2;
        const cz = (minZ + maxZ) / 2;
        const width = maxX - minX;
        const depth = maxZ - minZ;
        const eaveY = state.houseBaseY + 0.14 + WALL_HEIGHT + 0.16;
        const ridgeAlongX = width >= depth;
        const span = ridgeAlongX ? depth : width;
        const length = ridgeAlongX ? width : depth;
        const overhang = 0.34;
        const ridgeH = Math.min(1.45, Math.max(0.85, span * 0.34));
        const halfSpan = span / 2;
        const slopeLen = Math.hypot(halfSpan + overhang, ridgeH);
        const slopeAngle = Math.atan2(ridgeH, halfSpan);

        if (state.roofStage === 0) {
            // ETAPA 1 DO TELHADO: Oitões triangulares + Cumeeira + Caibros inclinados de madeira
            const roofFrame = new THREE.Group();
            roofFrame.position.set(cx, eaveY, cz);
            if (!ridgeAlongX) roofFrame.rotation.y = Math.PI / 2;

            // Oitões (triângulos de fechamento nas duas extremidades)
            const triShape = new THREE.Shape();
            triShape.moveTo(-halfSpan, 0);
            triShape.lineTo(halfSpan, 0);
            triShape.lineTo(0, ridgeH);
            triShape.closePath();
            const gableGeo = new THREE.ExtrudeGeometry(triShape, { depth: 0.18, bevelEnabled: false });
            gableGeo.rotateY(Math.PI / 2);

            const g1 = new THREE.Mesh(gableGeo, matConcrete);
            g1.position.set(-length / 2, 0, 0);
            g1.castShadow = true;
            const g2 = new THREE.Mesh(gableGeo, matConcrete);
            g2.position.set(length / 2 - 0.18, 0, 0);
            g2.castShadow = true;
            roofFrame.add(g1, g2);

            // Cumeeira central
            const ridgeBeam = new THREE.Mesh(new THREE.BoxGeometry(length + overhang * 2, 0.12, 0.10), matWood);
            ridgeBeam.position.set(0, ridgeH, 0);
            ridgeBeam.castShadow = true;
            roofFrame.add(ridgeBeam);

            // Caibros inclinados nos dois lados
            const numRafters = Math.max(4, Math.ceil(length) + 1);
            for (let i = 0; i < numRafters; i++) {
                const rx = -length / 2 - overhang * 0.6 + (i / (numRafters - 1)) * (length + overhang * 1.2);
                [-1, 1].forEach(side => {
                    const rafter = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.09, slopeLen), matWood);
                    rafter.position.set(rx, ridgeH / 2 - 0.04, side * (halfSpan + overhang * 0.4) / 2);
                    rafter.rotation.x = side * slopeAngle;
                    rafter.castShadow = true;
                    roofFrame.add(rafter);
                });
            }

            roofGroup.add(roofFrame);
            state.roofStage = 1;
            SoundFX.playHammerWood();
            showToast('Madeiramento e oitões prontos! Clique novamente para assentar as telhas cerâmicas.', '🪵');
        } else if (state.roofStage === 1) {
            // ETAPA 2 DO TELHADO: Duas águas inclinadas de telha cerâmica + cumeeira cerâmica
            const tilesGrp = new THREE.Group();
            tilesGrp.position.set(cx, eaveY, cz);
            if (!ridgeAlongX) tilesGrp.rotation.y = Math.PI / 2;

            const roofLen = length + overhang * 2;
            [-1, 1].forEach(side => {
                const plane = new THREE.Mesh(new THREE.BoxGeometry(roofLen, 0.075, slopeLen + 0.08), matRoofTile);
                plane.position.set(0, ridgeH / 2 + 0.03, side * (halfSpan + overhang * 0.42) / 2);
                plane.rotation.x = side * slopeAngle;
                plane.castShadow = true;
                plane.receiveShadow = true;
                tilesGrp.add(plane);
            });

            // Telha de cumeeira arredondada no topo
            const cap = new THREE.Mesh(
                new THREE.CylinderGeometry(0.11, 0.11, roofLen + 0.04, 10, 1, false, 0, Math.PI),
                matRoofTile
            );
            cap.rotation.z = Math.PI / 2;
            cap.rotation.x = -Math.PI / 2;
            cap.position.set(0, ridgeH + 0.07, 0);
            cap.castShadow = true;
            tilesGrp.add(cap);

            roofGroup.add(tilesGrp);
            state.roofStage = 2;
            SoundFX.playBrickClack();
            showToast('Telhado 2 águas concluído! Agora passe o Reboco nas paredes.', '🏠');
            selectTool('plaster');
        }
    }

    function addIngredient(type) {
        if (state.mortarCharges > 0) {
            showToast('Masseira cheia! Arraste ou clique no Balde para abastecer.', '🪣');
            return false;
        }
        if (type === 'sand' && state.sand < 3) state.sand++;
        else if (type === 'cement' && state.cement < 1) state.cement++;
        else if (type === 'water' && state.water < 1) state.water++;
        else return false;

        state.mixProgress = 0;
        updateMixerVisuals();
        SoundFX.playMortarSquish();
        return true;
    }

    function updateMixerVisuals() {
        const total = state.sand + state.cement + state.water;
        if (total === 0 && state.mortarCharges === 0) {
            mixerFill.visible = false;
        } else {
            mixerFill.visible = true;
            const ratio = state.mortarCharges > 0 ? (state.mortarCharges / 12) : (total / 5);
            mixerFill.scale.y = Math.max(0.16, ratio);
            mixerFill.position.y = 0.08 + (0.25 * mixerFill.scale.y) / 2;
            if (state.mortarCharges === 0) {
                mixerFillMat.color.setHex(state.water > 0 ? 0x8d8272 : (state.cement > 0 ? 0xa89b84 : 0xc99a56));
            }
        }
        const elS = document.getElementById('cnt-sand');
        const elC = document.getElementById('cnt-cement');
        const elW = document.getElementById('cnt-water');
        const elM = document.getElementById('cnt-mix');
        if (elS) elS.textContent = `${state.sand}/3`;
        if (elC) elC.textContent = `${state.cement}/1`;
        if (elW) elW.textContent = `${state.water}/1`;
        if (elM) elM.textContent = `${Math.round(state.mixProgress)}%`;
        updateBucketUI();
    }

    function fillBucketFromMixer() {
        if (state.mortarCharges <= 0) {
            showToast('Bata massa na masseira primeiro (3 Areia, 1 Cimento, 1 Água)!', '⚠️');
            return;
        }
        if (state.bucketCharges >= 4) return;
        const tr = Math.min(4 - state.bucketCharges, state.mortarCharges);
        state.bucketCharges += tr;
        state.mortarCharges -= tr;
        updateMixerVisuals();
        SoundFX.playMortarSquish();
        showToast(`Balde abastecido (${state.bucketCharges.toFixed(0)}/4 cargas)!`, '🪣');
    }

    function updateBucketUI() {
        if (bucketConcreteFill) bucketConcreteFill.visible = state.bucketCharges > 0;
        const txt = `🪣 ${state.bucketCharges.toFixed(1).replace('.0', '')}/4`;
        const b2 = document.getElementById('bucket-pill-2');
        const b3 = document.getElementById('bucket-pill-3');
        if (b2) b2.textContent = txt;
        if (b3) b3.textContent = txt;
    }

    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function setMouseNDC(e) {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }

    function applyBucketAtPoint(pt) {
        if (state.bucketCharges <= 0) return false;

        if (state.phase === 2) {
            for (let col of state.columns) {
                if (!col.concreted && col.hasFormwork && Math.hypot(pt.x - col.x, pt.z - col.z) < 0.72) {
                    state.bucketCharges = Math.max(0, state.bucketCharges - 1);
                    concreteColumn(col);
                    updateBucketUI();
                    if (state.columns.every(c => c.concreted)) {
                        showToast('Todas as colunas concretadas! Clique em Alvenaria → para continuar.', '✅');
                    }
                    return true;
                }
            }
        }

        if (state.phase === 3) {
            for (let wall of state.walls) {
                const unplaced = wall.slots.filter(s => !s.placed);
                if (!unplaced.length) continue;
                const low = Math.min(...unplaced.map(s => s.row));
                for (let slot of unplaced.filter(s => s.row === low && !s.hasMortar)) {
                    if (Math.hypot(pt.x - slot.x, pt.z - slot.z) < 0.58) {
                        slot.hasMortar = true;
                        slot.mortarMesh.visible = true;
                        slot.guideMesh.material.color.setHex(0x10b981);
                        slot.guideMesh.material.opacity = 0.30;
                        state.bucketCharges = Math.max(0, state.bucketCharges - 0.25);
                        SoundFX.playMortarSquish();
                        updateBucketUI();
                        return true;
                    }
                }
            }
            if (state.tool === 'floor') {
                for (let ft of state.floorTiles) {
                    if (!ft.concreted && Math.hypot(pt.x - ft.x, pt.z - ft.z) < 0.6) {
                        pourFloorTile(ft);
                        return true;
                    }
                }
            }
        }
        return false;
    }

    function pourFloorTile(ft) {
        if (ft.concreted) return;
        if (state.bucketCharges <= 0) {
            showToast('Balde vazio! Abasteça na Masseira.', '🪣');
            return;
        }
        ft.concreted = true;
        state.bucketCharges = Math.max(0, state.bucketCharges - 0.5);
        ft.hitbox.visible = false;
        const slab = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.14, 0.98), matConcrete);
        slab.position.set(ft.x, state.houseBaseY + 0.07, ft.z);
        slab.receiveShadow = true;
        slab.userData = { floorTile: ft };
        ft.slabMesh = slab;
        floorGroup.add(slab);
        SoundFX.playMortarSquish();
        updateBucketUI();
    }

    window.addEventListener('pointerdown', (e) => {
        if (e.button === 2 || e.button === 1) {
            camOrbit.isDragging = true;
            camOrbit.prevX = e.clientX;
            camOrbit.prevY = e.clientY;
            return;
        }
        if (e.button !== 0) return;
        if (e.target.closest('button') || e.target.closest('.dock-surface')) return;

        setMouseNDC(e);
        raycaster.setFromCamera(mouse, camera);

        // --- INTERAÇÃO GLOBAL COM INSUMOS DA MASSEIRA (FASES 2, 3, 5) ---
        if (state.phase >= 2 && state.tool !== 'erase') {
            const supHits = raycaster.intersectObjects(physicsSuppliesGroup.children, true);
            if (supHits.length > 0) {
                const item = supHits[0].object.userData.physicalSupply;
                if (item && !item.consumed) {
                    // Clique rápido no balde enche se houver massa; arrastar move livremente
                    if (item.type === 'bucket' && state.mortarCharges > 0 && state.bucketCharges < 4) {
                        fillBucketFromMixer();
                    }
                    state.draggedItem = { kind: 'supply', ref: item, startX: e.clientX, startY: e.clientY };
                    return;
                }
            }

            const mixHit = raycaster.intersectObject(mixerStirHitbox);
            if (mixHit.length > 0) {
                if (state.sand === 3 && state.cement === 1 && state.water === 1 && state.mortarCharges === 0) {
                    state.isStirringMixer = true;
                    state.lastStirPos.set(e.clientX, e.clientY);
                    hoeGroup.visible = true;
                    showToast('Mova o mouse dentro da masseira para bater a massa!', '🥄');
                } else if (state.mortarCharges > 0) {
                    fillBucketFromMixer();
                } else {
                    showToast('Jogue 3 Areia, 1 Cimento e 1 Água na masseira primeiro!', '⚠️');
                }
                return;
            }
        }

        // --- FASE 1: TERRENO, TERRAPLANAGEM & PLANTA ---
        if (state.phase === 1) {
            if (state.tool === 'level') {
                const th = raycaster.intersectObject(terrainMesh);
                if (th.length > 0) {
                    state.isLevelingTerrain = true;
                    const p = th[0].point;
                    paintLevelWeight(p.x, p.z, 1.65, 0.45);
                    updateTerrainGeometry();
                    spawnBurst(p.x, p.y + 0.1, p.z, 0x7a654d, 8);
                    SoundFX.playDirtShovel();
                }
                return;
            }

            if (state.tool === 'door' || state.tool === 'window') {
                const bpHits = raycaster.intersectObjects(blueprintGroup.children);
                for (let h of bpHits) {
                    if (h.object.userData.wallSegment) {
                        toggleWallOpening(h.object.userData.wallSegment, state.tool);
                        SoundFX.playHammerWood();
                        return;
                    }
                }
                return;
            }

            if (state.tool === 'muro') {
                const th = raycaster.intersectObject(terrainMesh);
                if (th.length > 0) {
                    const p = th[0].point;
                    const c = worldToGrid(p);
                    const center = gridToWorldCenter(c.gx, c.gz);
                    const ori = Math.abs(p.x - center.x) > Math.abs(p.z - center.z) ? 'V' : 'H';
                    const mx = ori === 'V' ? (p.x > center.x ? center.x + 0.48 : center.x - 0.48) : center.x;
                    const mz = ori === 'H' ? (p.z > center.z ? center.z + 0.48 : center.z - 0.48) : center.z;
                    state.muros.push({ x: mx, z: mz, ori, built: false });
                    renderMurosAndStairsBlueprint();
                    SoundFX.playBrickClack();
                }
                return;
            }

            if (state.tool === 'stair') {
                const th = raycaster.intersectObject(terrainMesh);
                if (th.length > 0) {
                    const c = worldToGrid(th[0].point);
                    const center = gridToWorldCenter(c.gx, c.gz);
                    state.stairs.push({ x: center.x, z: center.z, built: false });
                    renderMurosAndStairsBlueprint();
                    SoundFX.playHammerWood();
                }
                return;
            }

            if (state.tool === 'erase') {
                // Tenta apagar muro, escada ou abertura primeiro
                const msHits = raycaster.intersectObjects(muroStairGroup.children, true);
                if (msHits.length > 0) {
                    const mr = msHits[0].object.userData.muroRef;
                    const sr = msHits[0].object.userData.stairRef;
                    if (mr) { state.muros = state.muros.filter(m => m !== mr); renderMurosAndStairsBlueprint(); showToast('Muro removido!', '🗑️'); return; }
                    if (sr) { state.stairs = state.stairs.filter(s => s !== sr); renderMurosAndStairsBlueprint(); showToast('Escada removida!', '🗑️'); return; }
                }
                const bpHits = raycaster.intersectObjects(blueprintGroup.children);
                for (let h of bpHits) {
                    if (h.object.userData.wallSegment && h.object.userData.wallSegment.opening) {
                        toggleWallOpening(h.object.userData.wallSegment, h.object.userData.wallSegment.opening);
                        return;
                    }
                }
                const th = raycaster.intersectObject(terrainMesh);
                if (th.length > 0) {
                    isDrawingRect = true;
                    dragStartCell = worldToGrid(th[0].point);
                    selectionPreview.material.color.setHex(0xf43f5e);
                    updateSelectionPreview(dragStartCell, dragStartCell);
                }
                return;
            }

            if (state.tool === 'room') {
                const th = raycaster.intersectObject(terrainMesh);
                if (th.length > 0) {
                    isDrawingRect = true;
                    dragStartCell = worldToGrid(th[0].point);
                    selectionPreview.material.color.setHex(0x38bdf8);
                    updateSelectionPreview(dragStartCell, dragStartCell);
                }
                return;
            }
        }

        // --- FASE 2: FUNDAÇÃO, ARMADURAS, CAIXARIA & CONCRETO ---
        if (state.phase === 2) {
            if (state.tool === 'rebar' && state.looseRebars.length > 0) {
                const rHits = raycaster.intersectObjects(looseRebarsGroup.children, true);
                if (rHits.length > 0) {
                    const rObj = rHits[0].object.userData.rebarObj;
                    if (rObj && !rObj.installed) {
                        state.draggedItem = { kind: 'rebar', ref: rObj };
                        rObj.mesh.rotation.set(0, 0, 0);
                        return;
                    }
                }
            }

            const cHits = raycaster.intersectObjects(state.columns.map(c => c.hitbox));
            if (cHits.length > 0) {
                const col = cHits[0].object.userData.column;
                if (state.tool === 'erase') {
                    eraseColumn(col);
                } else if (state.tool === 'dig' && !col.dug) {
                    col.dug = true;
                    col.ringMesh.material.color.setHex(0x38bdf8);
                    const hole = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.06, 0.46), matHole);
                    hole.position.y = 0.03;
                    col.holeMesh = hole;
                    col.meshGroup.add(hole);
                    spawnBurst(col.x, col.terrainY + 0.1, col.z, 0x5c4632, 9);
                    SoundFX.playDirtShovel();
                    if (state.columns.every(c => c.dug)) { selectTool('rebar'); showToast('Sapatas cavadas! Peça as Armaduras.', '⛓️'); }
                } else if (state.tool === 'formwork') {
                    if (!col.hasRebar) showToast('Encaixe a armadura de aço antes da caixaria!', '⚠️');
                    else if (!col.hasFormwork) {
                        attachWoodFormworkToColumn(col);
                        SoundFX.playHammerWood();
                        if (state.columns.every(c => c.hasFormwork)) { selectTool('mixer'); showToast('Caixarias prontas! Prepare o concreto na Masseira.', '🥣'); }
                    }
                } else if (state.tool === 'pour-col') {
                    if (!col.hasFormwork) showToast('Pregue a caixaria antes de concretar!', '⚠️');
                    else if (state.bucketCharges <= 0) showToast('Balde vazio! Abasteça na Masseira.', '🪣');
                    else if (!col.concreted) {
                        state.bucketCharges = Math.max(0, state.bucketCharges - 1);
                        concreteColumn(col);
                        updateBucketUI();
                        if (state.columns.every(c => c.concreted)) showToast('Todas as colunas prontas! Avance para Alvenaria →', '✅');
                    }
                }
            }
            return;
        }

        // --- FASE 3: ALVENARIA ERGONÔMICA, MURO, ESCADA & CONTRAPISO ---
        if (state.phase === 3) {
            if (state.tool === 'erase') {
                const wHits = raycaster.intersectObjects(wallsGroup.children);
                for (let h of wHits) {
                    const sl = h.object.userData.wallSlot;
                    if (sl && sl.placed) { sl.placed = false; sl.mesh.visible = false; sl.guideMesh.visible = true; SoundFX.playBrickClack(); return; }
                    if (sl && sl.hasMortar) { sl.hasMortar = false; sl.mortarMesh.visible = false; sl.guideMesh.material.color.setHex(0xf59e0b); return; }
                }
                const fHits = raycaster.intersectObjects(floorGroup.children);
                for (let h of fHits) {
                    const ft = h.object.userData.floorTile;
                    if (ft && ft.concreted) { ft.concreted = false; floorGroup.remove(ft.slabMesh); ft.hitbox.visible = true; return; }
                }
                return;
            }

            if (state.tool === 'prop') {
                const vHits = raycaster.intersectObjects(wallsGroup.children);
                for (let h of vHits) {
                    const vw = h.object.userData.voidWall;
                    if (vw && !vw.hasProp) {
                        vw.hasProp = true;
                        vw.propGroup.visible = true;
                        SoundFX.playHammerWood();
                        showToast('Escora instalada no vão! Verga liberada.', '🪵');
                        return;
                    }
                }
                return;
            }

            if (state.tool === 'floor') {
                const fHits = raycaster.intersectObjects(floorGroup.children);
                if (fHits.length > 0 && fHits[0].object.userData.floorTile) {
                    pourFloorTile(fHits[0].object.userData.floorTile);
                }
                return;
            }

            // Construir Muro ou Escada clicando neles
            const msHits = raycaster.intersectObjects(muroStairGroup.children, true);
            if (msHits.length > 0) {
                const mr = msHits[0].object.userData.muroRef;
                const sr = msHits[0].object.userData.stairRef;
                if (mr && !mr.built) {
                    mr.built = true; renderMurosAndStairsBlueprint(); SoundFX.playBrickClack();
                    showToast('Segmento de muro construído!', '🧱'); return;
                }
                if (sr && !sr.built) {
                    sr.built = true; renderMurosAndStairsBlueprint(); SoundFX.playMortarSquish();
                    showToast('Escada externa concretada!', '🪜'); return;
                }
            }

            // 1. Clique em um tijolo do palete para pegar na mão
            const bHits = raycaster.intersectObjects(looseBricksGroup.children, true);
            if (bHits.length > 0) {
                const bObj = bHits[0].object.userData.looseBrick;
                if (bObj && !bObj.placed) {
                    if (state.selectedBrickInHand) state.selectedBrickInHand.mesh.scale.set(1, 1, 1);
                    state.selectedBrickInHand = bObj;
                    bObj.mesh.scale.set(1.22, 1.22, 1.22);
                    SoundFX.playBrickClack();
                    showToast('Tijolo selecionado! Clique na parede para assentar.', '🧱');
                    return;
                }
            }

            // 2. Clique direto na parede: se não tem massa e o balde está cheio, passa massa; se já tem massa e tem tijolo, assenta!
            const wHits = raycaster.intersectObjects(wallsGroup.children);
            for (let h of wHits) {
                const slot = h.object.userData.wallSlot;
                if (!slot || slot.placed) continue;
                const unplaced = slot.wallRef.slots.filter(s => !s.placed);
                const low = Math.min(...unplaced.map(s => s.row));
                if (slot.row > low) { showToast('Complete a fiada de baixo primeiro!', '⚠️'); return; }

                if (!slot.hasMortar) {
                    if (state.bucketCharges <= 0) { showToast('Balde vazio! Abasteça na Masseira para passar argamassa.', '🪣'); return; }
                    slot.hasMortar = true;
                    slot.mortarMesh.visible = true;
                    slot.guideMesh.material.color.setHex(0x10b981);
                    slot.guideMesh.material.opacity = 0.30;
                    state.bucketCharges = Math.max(0, state.bucketCharges - 0.25);
                    SoundFX.playMortarSquish();
                    updateBucketUI();
                    return;
                }

                if (slot.isLintel && !slot.wallRef.hasProp) {
                    showToast('Instale a Escora Vão antes de colocar a verga sobre porta/janela!', '⚠️');
                    return;
                }

                if (!state.selectedBrickInHand) {
                    const nextB = state.looseBricks.find(b => !b.placed);
                    if (!nextB) { showToast('Acabaram os tijolos! Clique em + Palete.', '🧱'); return; }
                    state.selectedBrickInHand = nextB;
                }

                const brick = state.selectedBrickInHand;
                brick.placed = true; brick.mesh.visible = false; brick.mesh.scale.set(1, 1, 1);
                state.selectedBrickInHand = state.looseBricks.find(b => !b.placed) || null;
                if (state.selectedBrickInHand) state.selectedBrickInHand.mesh.scale.set(1.22, 1.22, 1.22);
                animateBrickDrop(slot);
                return;
            }
        }

        // --- FASE 4: INSTALAÇÕES MEP (ELÉTRICA & HIDRÁULICA) ---
        if (state.phase === 4) {
            if (state.tool === 'erase') {
                const mHits = raycaster.intersectObjects(mepGroup.children);
                if (mHits.length > 0 && mHits[0].object.userData.mepNode) {
                    const nd = mHits[0].object.userData.mepNode;
                    mepGroup.remove(nd.mesh);
                    state.elecNodes = state.elecNodes.filter(n => n !== nd);
                    state.plumbNodes = state.plumbNodes.filter(n => n !== nd);
                    showToast('Ponto MEP removido!', '🗑️');
                }
                return;
            }

            if (state.tool === 'elec') {
                const wHits = raycaster.intersectObjects(state.walls.map(w => w.finishHitbox));
                if (wHits.length > 0) {
                    placeElectricalNode(wHits[0].object.userData.finishWall, wHits[0].point);
                }
                return;
            }

            if (state.tool === 'plumb') {
                const hasTank = state.plumbNodes.some(n => n.type === 'tank');
                if (!hasTank) {
                    // 1º clique coloca Caixa d'Água sobre a casa
                    const ft = state.floorTiles[0];
                    const pt = ft ? new THREE.Vector3(ft.x, state.houseBaseY + WALL_HEIGHT, ft.z) : new THREE.Vector3(0, 2, 0);
                    placePlumbingNode('tank', pt);
                    return;
                }
                // Se clicou em parede -> ponto de água; se clicou no terreno externo -> Fossa
                const wHits = raycaster.intersectObjects(state.walls.map(w => w.finishHitbox));
                if (wHits.length > 0) {
                    placePlumbingNode('fixture', wHits[0].point);
                    return;
                }
                const tHits = raycaster.intersectObject(terrainMesh);
                if (tHits.length > 0) {
                    placePlumbingNode('sewage', tHits[0].point);
                }
                return;
            }
        }

        // --- FASE 5: CINTA, TELHADO 2 ÁGUAS, REBOCO RECORTADO, ESQUADRIAS & PINTURA ---
        if (state.phase === 5) {
            if (state.tool === 'roof') {
                buildRealGableRoofStage();
                return;
            }

            const wHits = raycaster.intersectObjects(state.walls.map(w => w.finishHitbox));
            if (wHits.length > 0) {
                const fw = wHits[0].object.userData.finishWall;
                if (state.tool === 'beam' && !fw.hasTopBeam) {
                    fw.hasTopBeam = true;
                    fw.topBeamMesh.visible = true;
                    if (fw.propGroup) fw.propGroup.visible = false;
                    SoundFX.playMortarSquish();
                    if (state.walls.every(w => w.hasTopBeam)) {
                        showToast('Cinta superior completa! Selecione Telhado para montar as 2 águas.', '🏠');
                        selectTool('roof');
                    }
                } else if (state.tool === 'plaster' && !fw.isPlastered) {
                    fw.isPlastered = true;
                    fw.plasterGroup.visible = true;
                    // Esconde guias restantes mantendo os tijolos nos vãos limpos
                    fw.slots.forEach(s => { s.guideMesh.visible = false; });
                    SoundFX.playMortarSquish();
                    if (state.walls.every(w => w.isPlastered)) {
                        showToast('Reboco concluído! Instale as Esquadrias (portas e janelas).', '🚪');
                        selectTool('fixtures');
                    }
                } else if (state.tool === 'fixtures') {
                    if (!fw.opening) { showToast('Esta parede não possui vão de porta ou janela.', 'ℹ️'); return; }
                    if (!fw.hasFixture && fw.fixtureGroup) {
                        fw.hasFixture = true;
                        fw.fixtureGroup.visible = true;
                        SoundFX.playHammerWood();
                        showToast(fw.opening === 'door' ? 'Porta de madeira instalada!' : 'Janela de vidro instalada!', '🚪');
                    }
                } else if (state.tool === 'paint') {
                    if (!fw.isPlastered) { showToast('Reboque esta parede antes de pintar!', '⚠️'); return; }
                    fw.isPainted = true;
                    fw.plasterMat.color.set(state.paintColorHex);
                    SoundFX.playMortarSquish();
                    if (state.walls.every(w => w.isPainted)) {
                        showToast('🏆 OBRA 100% CONCLUÍDA! Arquitetura finalizada com sucesso!', '🎉');
                    }
                } else if (state.tool === 'erase') {
                    if (fw.isPainted) { fw.isPainted = false; fw.plasterMat.color.setHex(0xd6d3d1); }
                    else if (fw.hasFixture) { fw.hasFixture = false; fw.fixtureGroup.visible = false; }
                    else if (fw.isPlastered) { fw.isPlastered = false; fw.plasterGroup.visible = false; }
                    else if (fw.hasTopBeam) { fw.hasTopBeam = false; fw.topBeamMesh.visible = false; }
                }
            }
        }
    });

    window.addEventListener('pointermove', (e) => {
        if (camOrbit.isDragging) {
            camOrbit.theta -= (e.clientX - camOrbit.prevX) * 0.007;
            camOrbit.phi = Math.max(0.28, Math.min(1.36, camOrbit.phi - (e.clientY - camOrbit.prevY) * 0.007));
            camOrbit.prevX = e.clientX;
            camOrbit.prevY = e.clientY;
            return;
        }

        // Terraplanagem contínua com o mouse
        if (state.isLevelingTerrain && state.phase === 1 && state.tool === 'level') {
            setMouseNDC(e);
            raycaster.setFromCamera(mouse, camera);
            const th = raycaster.intersectObject(terrainMesh);
            if (th.length > 0) {
                const p = th[0].point;
                paintLevelWeight(p.x, p.z, 1.65, 0.25);
                updateTerrainGeometry();
                const now = performance.now();
                if (now - state.lastShovelTime > 150) {
                    spawnBurst(p.x, p.y + 0.08, p.z, 0x7a654d, 5);
                    SoundFX.playDirtShovel();
                    state.lastShovelTime = now;
                }
            }
            return;
        }

        // Mexendo a massa com a enxada 3D
        if (state.isStirringMixer) {
            const distMoved = Math.hypot(e.clientX - state.lastStirPos.x, e.clientY - state.lastStirPos.y);
            state.lastStirPos.set(e.clientX, e.clientY);

            setMouseNDC(e);
            raycaster.setFromCamera(mouse, camera);
            const th = raycaster.intersectObject(terrainMesh);
            if (th.length > 0) {
                const lx = Math.max(-0.55, Math.min(0.55, th[0].point.x - stationGroup.position.x));
                const lz = Math.max(-0.38, Math.min(0.38, th[0].point.z - stationGroup.position.z));
                hoeGroup.position.x += (lx - hoeGroup.position.x) * 0.45;
                hoeGroup.position.z += (lz - hoeGroup.position.z) * 0.45;
                hoeGroup.rotation.y = Math.atan2(lx, lz);
            }

            if (distMoved > 1.5) {
                state.mixProgress = Math.min(100, state.mixProgress + distMoved * 0.20);
                const r = state.mixProgress / 100;
                mixerFillMat.color.copy(new THREE.Color(0xc99a56)).lerp(new THREE.Color(0x5b636c), r);
                mixerBarGroup.visible = true;
                mixerBarFill.scale.x = Math.max(0.01, r);
                mixerBarFill.position.x = -0.52 * (1 - r);

                const now = performance.now();
                if (now - state.lastScrapeTime > 125) {
                    SoundFX.playMixerScrape();
                    spawnBurst(stationGroup.position.x + hoeGroup.position.x, stationGroup.position.y + 0.32, stationGroup.position.z + hoeGroup.position.z, 0x94a3b8, 3, 0.04);
                    state.lastScrapeTime = now;
                }
                updateMixerVisuals();

                if (state.mixProgress >= 100) {
                    state.isStirringMixer = false;
                    hoeGroup.visible = false;
                    mixerBarGroup.visible = false;
                    state.mortarCharges = 12;
                    state.sand = 0; state.cement = 0; state.water = 0;
                    SoundFX.playMortarSquish();
                    updateMixerVisuals();
                    showToast('Massa no ponto! Clique ou arraste o Balde na masseira.', '✅');
                }
            }
            return;
        }

        // Preview fantasma do tijolo na parede (Fase 3)
        if (state.phase === 3 && state.selectedBrickInHand && !state.draggedItem) {
            setMouseNDC(e);
            raycaster.setFromCamera(mouse, camera);
            const wHits = raycaster.intersectObjects(wallsGroup.children);
            let shown = false;
            for (let h of wHits) {
                const sl = h.object.userData.wallSlot;
                if (sl && !sl.placed) {
                    const low = Math.min(...sl.wallRef.slots.filter(s => !s.placed).map(s => s.row));
                    if (sl.row === low) {
                        brickHoverGhost.visible = true;
                        brickHoverGhost.position.set(sl.x, sl.y + 0.015, sl.z);
                        brickHoverGhost.rotation.y = sl.ori === 'V' ? Math.PI / 2 : 0;
                        brickHoverGhost.material.color.setHex(sl.hasMortar ? 0x34d399 : 0xfbbf24);
                        shown = true;
                        break;
                    }
                }
            }
            if (!shown) brickHoverGhost.visible = false;
        } else {
            brickHoverGhost.visible = false;
        }

        // Arrastando Armadura ou Insumo/Balde
        if (state.draggedItem) {
            setMouseNDC(e);
            raycaster.setFromCamera(mouse, camera);
            const th = raycaster.intersectObject(terrainMesh);
            if (th.length > 0) {
                const pt = th[0].point;
                const item = state.draggedItem.ref;
                const ty = getTerrainHeight(pt.x, pt.z);

                if (state.draggedItem.kind === 'rebar') {
                    item.mesh.position.set(pt.x, ty + 0.35, pt.z);
                } else if (state.draggedItem.kind === 'supply') {
                    item.mesh.position.set(pt.x, ty + 0.65, pt.z);
                    const dMix = Math.hypot(pt.x - stationGroup.position.x, pt.z - stationGroup.position.z);
                    if (dMix < 1.1) {
                        if (item.type === 'bucket') {
                            if (state.mortarCharges > 0 && state.bucketCharges < 4) fillBucketFromMixer();
                        } else {
                            item.mesh.rotation.z = 1.05;
                            if (addIngredient(item.type)) {
                                item.consumed = true;
                                item.mesh.visible = false;
                                state.draggedItem = null;
                            }
                        }
                    } else {
                        item.mesh.rotation.z = 0;
                        if (item.type === 'bucket' && state.bucketCharges > 0) applyBucketAtPoint(pt);
                    }
                }
            }
            return;
        }

        if (isDrawingRect && state.phase === 1) {
            setMouseNDC(e);
            raycaster.setFromCamera(mouse, camera);
            const th = raycaster.intersectObject(terrainMesh);
            if (th.length > 0) updateSelectionPreview(dragStartCell, worldToGrid(th[0].point));
        }
    });

    window.addEventListener('pointerup', (e) => {
        camOrbit.isDragging = false;
        state.isStirringMixer = false;
        state.isLevelingTerrain = false;
        hoeGroup.visible = false;

        if (state.draggedItem) {
            const { kind, ref, startX, startY } = state.draggedItem;
            state.draggedItem = null;

            if (kind === 'supply') {
                // Se foi um clique rápido num saco de areia/cimento/água (não arrastou), joga direto na masseira!
                if (ref.type !== 'bucket' && startX !== undefined && Math.hypot(e.clientX - startX, e.clientY - startY) < 8) {
                    if (addIngredient(ref.type)) {
                        ref.consumed = true;
                        ref.mesh.visible = false;
                        return;
                    }
                }
                ref.mesh.rotation.z = 0;
                ref.vy = 0;
                ref.grounded = false;
            } else if (kind === 'rebar') {
                let snapped = null;
                for (let col of state.columns) {
                    if (!col.hasRebar && Math.hypot(ref.mesh.position.x - col.x, ref.mesh.position.z - col.z) < 0.8) {
                        snapped = col; break;
                    }
                }
                if (snapped && snapped.dug) {
                    ref.installed = true;
                    snapped.hasRebar = true;
                    ref.mesh.position.set(snapped.x, snapped.terrainY + 0.02, snapped.z);
                    ref.mesh.rotation.set(0, 0, 0);
                    SoundFX.playMetalClang();
                    if (state.columns.every(c => c.hasRebar)) {
                        selectTool('formwork');
                        showToast('Armaduras encaixadas! Pregue a Caixaria nas colunas.', '🪵');
                    }
                } else {
                    if (snapped && !snapped.dug) showToast('Cave a sapata antes de encaixar a armadura!', '⚠️');
                    ref.vy = 0; ref.grounded = false; ref.mesh.rotation.z = Math.PI / 2 - 0.2;
                }
            }
            return;
        }

        if (isDrawingRect && state.phase === 1) {
            isDrawingRect = false;
            selectionPreview.visible = false;
            setMouseNDC(e);
            raycaster.setFromCamera(mouse, camera);
            const th = raycaster.intersectObject(terrainMesh);
            if (th.length > 0) {
                const endC = worldToGrid(th[0].point);
                const minX = Math.min(dragStartCell.gx, endC.gx), maxX = Math.max(dragStartCell.gx, endC.gx);
                const minZ = Math.min(dragStartCell.gz, endC.gz), maxZ = Math.max(dragStartCell.gz, endC.gz);
                for (let x = minX; x <= maxX; x++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        if (state.tool === 'erase') state.occupiedCells.delete(`${x},${z}`);
                        else state.occupiedCells.add(`${x},${z}`);
                    }
                }
                rebuildBlueprintFromCells();
            }
        }
    });

    window.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('wheel', e => {
        e.preventDefault();
        camOrbit.radius = Math.max(10, Math.min(34, camOrbit.radius + e.deltaY * 0.012));
    }, { passive: false });

    function updateSelectionPreview(c1, c2) {
        const minX = Math.min(c1.gx, c2.gx), maxX = Math.max(c1.gx, c2.gx);
        const minZ = Math.min(c1.gz, c2.gz), maxZ = Math.max(c1.gz, c2.gz);
        const w = maxX - minX + 1, d = maxZ - minZ + 1;
        const half = GRID_SIZE / 2;
        const px = minX - half + w / 2;
        const pz = minZ - half + d / 2 + GRID_OFFSET_Z;
        selectionPreview.scale.set(w, 1, d);
        selectionPreview.position.set(px, getTerrainHeight(px, pz) + 0.12, pz);
        selectionPreview.visible = true;
    }

    function eraseColumn(col) {
        if (col.concreted && col.pillarMesh) {
            col.concreted = false; col.meshGroup.remove(col.pillarMesh); col.pillarMesh = null;
            if (col.formworkMesh) col.formworkMesh.visible = true; col.ringMesh.visible = true;
        } else if (col.hasFormwork && col.formworkMesh) {
            col.hasFormwork = false; col.meshGroup.remove(col.formworkMesh); col.formworkMesh = null;
        } else if (col.dug && col.holeMesh) {
            col.dug = false; col.meshGroup.remove(col.holeMesh); col.holeMesh = null;
            col.ringMesh.material.color.setHex(0xf59e0b);
        }
    }

    // =========================================================================
    // 15. MINI AJUDANTES AUTÔNOMOS (CAMINHANDO SOBRE O RELEVO PROCEDURAL)
    // =========================================================================
    function createWorkerMesh(helmetHex, vestHex) {
        const g = new THREE.Group();
        const legMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.26, 0.10), legMat); legL.position.set(-0.07, 0.13, 0);
        const legR = legL.clone(); legR.position.x = 0.07;
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.32, 0.16), new THREE.MeshStandardMaterial({ color: vestHex, roughness: 0.75 }));
        torso.position.y = 0.42; torso.castShadow = true;
        const skin = new THREE.MeshStandardMaterial({ color: 0xfdba74, roughness: 0.7 });
        const armL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.24, 0.08), skin); armL.position.set(-0.18, 0.42, 0);
        const armR = armL.clone(); armR.position.x = 0.18;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), skin); head.position.y = 0.69;
        const hMat = new THREE.MeshStandardMaterial({ color: helmetHex, roughness: 0.35 });
        const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.56), hMat);
        helmet.position.y = 0.73; helmet.castShadow = true;
        const carryBrick = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.13, 0.12), matBrickCeramic);
        carryBrick.position.set(0, 0.44, 0.19); carryBrick.visible = false;
        g.add(legL, legR, torso, armL, armR, head, helmet, carryBrick);
        return { group: g, legL, legR, armL, armR, carryBrick };
    }

    window.hireMiniWorker = function() {
        if (state.phase === 1) {
            showToast('Inicie a obra antes de contratar ajudantes!', '👷');
            return;
        }
        if (state.workers.length >= 3) {
            showToast('Equipe completa (3/3 ajudantes na obra)!', '👷');
            return;
        }
        const styles = [
            { h: 0xfacc15, v: 0xd97706, n: 'Pedreiro Zé' },
            { h: 0xe2e8f0, v: 0x334155, n: 'Servente Léo' },
            { h: 0x65a30d, v: 0x475569, n: 'Mestre Beto' }
        ];
        const st = styles[state.workers.length];
        const rig = createWorkerMesh(st.h, st.v);
        const sx = -1.6 + state.workers.length * 1.4, sz = 2.4;
        rig.group.position.set(sx, getTerrainHeight(sx, sz), sz);
        workersGroup.add(rig.group);
        state.workers.push({ id: state.workers.length, rig, task: null, tx: sx, tz: sz, timer: 0, speed: 2.4 + state.workers.length * 0.2 });
        document.getElementById('worker-btn-label').textContent = `Ajudante (${state.workers.length}/3)`;
        SoundFX.playHammerWood();
        showToast(`${st.n} entrou no canteiro!`, '👷');
    };

    function assignWorkerTask(w) {
        if (state.phase === 2) {
            const cDig = state.columns.find(c => !c.dug && !c.res);
            if (cDig) { cDig.res = true; w.task = { type: 'dig', col: cDig }; w.tx = cDig.x; w.tz = cDig.z; return; }
            const cReb = state.columns.find(c => c.dug && !c.hasRebar && !c.res);
            if (cReb) { cReb.res = true; w.task = { type: 'rebar', col: cReb }; w.tx = cReb.x; w.tz = cReb.z; return; }
            const cFw = state.columns.find(c => c.hasRebar && !c.hasFormwork && !c.res);
            if (cFw) { cFw.res = true; w.task = { type: 'fw', col: cFw }; w.tx = cFw.x; w.tz = cFw.z; return; }
            const cPour = state.columns.find(c => c.hasFormwork && !c.concreted && !c.res);
            if (cPour) { cPour.res = true; w.task = { type: 'pour', col: cPour }; w.tx = cPour.x; w.tz = cPour.z; return; }
        }
        if (state.phase === 3) {
            for (let wall of state.walls) {
                const unp = wall.slots.filter(s => !s.placed && !s.res);
                if (!unp.length) continue;
                const low = Math.min(...wall.slots.filter(s => !s.placed).map(s => s.row));
                const sl = unp.find(s => s.row === low);
                if (!sl) continue;
                if (sl.isLintel && !wall.hasProp) { wall.hasProp = true; wall.propGroup.visible = true; }
                sl.res = true;
                w.task = { type: 'brick', slot: sl };
                w.tx = sl.x; w.tz = sl.z;
                w.rig.carryBrick.visible = true;
                return;
            }
            const ft = state.floorTiles.find(f => !f.concreted && !f.res);
            if (ft) { ft.res = true; w.task = { type: 'floor', ft }; w.tx = ft.x; w.tz = ft.z; return; }
        }
        if (state.phase === 5) {
            const bw = state.walls.find(wl => !wl.hasTopBeam && !wl.res);
            if (bw) { bw.res = true; w.task = { type: 'beam', wall: bw }; w.tx = (bw.x1 + bw.x2) / 2; w.tz = (bw.z1 + bw.z2) / 2; return; }
            const pw = state.walls.find(wl => !wl.isPlastered && !wl.res);
            if (pw) { pw.res = true; w.task = { type: 'plaster', wall: pw }; w.tx = (pw.x1 + pw.x2) / 2; w.tz = (pw.z1 + pw.z2) / 2; return; }
        }
    }

    function updateWorkers(dt, t) {
        state.workers.forEach(w => {
            if (!w.task) { w.rig.carryBrick.visible = false; assignWorkerTask(w); return; }
            const pos = w.rig.group.position;
            const dx = w.tx - pos.x, dz = w.tz - pos.z;
            const dist = Math.hypot(dx, dz);
            if (dist > 0.38) {
                const step = Math.min(dist, w.speed * dt);
                pos.x += (dx / dist) * step;
                pos.z += (dz / dist) * step;
                w.rig.group.rotation.y = Math.atan2(dx, dz);
                const cyc = Math.sin(t * 14 + w.id * 2);
                w.rig.legL.rotation.x = cyc * 0.6;
                w.rig.legR.rotation.x = -cyc * 0.6;
                w.rig.armL.rotation.x = w.rig.carryBrick.visible ? -1.0 : -cyc * 0.45;
                w.rig.armR.rotation.x = w.rig.carryBrick.visible ? -1.0 : cyc * 0.45;
                pos.y = getTerrainHeight(pos.x, pos.z) + Math.abs(cyc) * 0.03;
            } else {
                w.timer += dt;
                w.rig.armL.rotation.x = -0.7 + Math.sin(t * 18) * 0.35;
                w.rig.armR.rotation.x = -0.7 - Math.sin(t * 18) * 0.35;
                if (w.timer < 0.42) return;
                w.timer = 0;
                const tk = w.task;
                if (tk.type === 'dig') {
                    tk.col.dug = true; tk.col.ringMesh.material.color.setHex(0x38bdf8);
                    const hole = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.06, 0.46), matHole); hole.position.y = 0.03;
                    tk.col.holeMesh = hole; tk.col.meshGroup.add(hole); SoundFX.playDirtShovel(); tk.col.res = false;
                } else if (tk.type === 'rebar') {
                    tk.col.hasRebar = true; const c = createRebarCageMesh(); c.position.set(tk.col.x, tk.col.terrainY + 0.02, tk.col.z);
                    looseRebarsGroup.add(c); SoundFX.playMetalClang(); tk.col.res = false;
                } else if (tk.type === 'fw') {
                    attachWoodFormworkToColumn(tk.col); SoundFX.playHammerWood(); tk.col.res = false;
                } else if (tk.type === 'pour') {
                    concreteColumn(tk.col); tk.col.res = false;
                } else if (tk.type === 'brick') {
                    tk.slot.hasMortar = true; tk.slot.mortarMesh.visible = true;
                    animateBrickDrop(tk.slot); tk.slot.res = false;
                } else if (tk.type === 'floor') {
                    tk.ft.concreted = true; tk.ft.hitbox.visible = false;
                    const slab = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.14, 0.98), matConcrete);
                    slab.position.set(tk.ft.x, state.houseBaseY + 0.07, tk.ft.z); slab.receiveShadow = true;
                    tk.ft.slabMesh = slab; floorGroup.add(slab); SoundFX.playMortarSquish(); tk.ft.res = false;
                } else if (tk.type === 'beam') {
                    tk.wall.hasTopBeam = true; tk.wall.topBeamMesh.visible = true;
                    if (tk.wall.propGroup) tk.wall.propGroup.visible = false; SoundFX.playMortarSquish(); tk.wall.res = false;
                } else if (tk.type === 'plaster') {
                    tk.wall.isPlastered = true; tk.wall.plasterGroup.visible = true;
                    SoundFX.playMortarSquish(); tk.wall.res = false;
                }
                w.rig.carryBrick.visible = false;
                w.task = null;
            }
        });
    }

    // =========================================================================
    // 16. UI, TROCA DE FASE & REGENERAÇÃO DE TERRENO PROCEDURAL
    // =========================================================================
    function syncPhaseUI() {
        [1, 2, 3, 4, 5].forEach(p => {
            const el = document.getElementById(`dock-phase-${p}`);
            if (el) el.classList.toggle('hidden', state.phase !== p);
        });
        const names = {
            1: 'TERRENO & PLANTA',
            2: 'FUNDAÇÃO & COLUNAS',
            3: 'ALVENARIA & PISO',
            4: 'INSTALAÇÕES MEP',
            5: 'TELHADO & ACABAMENTO'
        };
        document.getElementById('phase-indicator').textContent = `FASE ${state.phase} · ${names[state.phase]} · SEED #${state.seed}`;
    }

    window.selectTool = function(tool) {
        state.tool = tool;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active', 'erase-on'));
        const btn = document.getElementById(`tool-${tool}`);
        if (btn) btn.classList.add(tool === 'erase' ? 'erase-on' : 'active');
        if (tool === 'mixer' && state.phase === 3) {
            const m3 = document.getElementById('tool-mixer-3');
            if (m3) m3.classList.add('active');
        }
        const subR = document.getElementById('sub-rebar');
        const subM = document.getElementById('sub-mixer');
        if (subR) subR.classList.toggle('hidden', tool !== 'rebar');
        if (subM) subM.classList.toggle('hidden', tool !== 'mixer');
    };

    function showToast(msg, icon = '🏗️') {
        const box = document.getElementById('toast-box');
        document.getElementById('toast-message').textContent = msg;
        document.getElementById('toast-icon').textContent = icon;
        box.classList.remove('opacity-0', '-translate-y-2');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => box.classList.add('opacity-0', '-translate-y-2'), 3400);
    }

    window.regenerateNewTerrain = function() {
        state.seed = Math.floor(1000 + Math.random() * 8999);
        levelMap.fill(0);
        state.phase = 1;
        state.occupiedCells.clear();
        state.columns = []; state.walls = []; state.muros = []; state.stairs = []; state.floorTiles = [];
        state.looseRebars = []; state.looseBricks = []; state.workers = [];
        state.elecNodes = []; state.elecConduits = []; state.elecLights = []; state.elecPowerOn = false;
        state.plumbNodes = []; state.plumbPipes = []; state.leakPoints = [];
        state.roofStage = 0; state.sand = 0; state.cement = 0; state.water = 0; state.mortarCharges = 0; state.bucketCharges = 0;
        bucketObj = null;

        [blueprintGroup, foundationGroup, looseRebarsGroup, wallsGroup, muroStairGroup,
         looseBricksGroup, floorGroup, mepGroup, roofGroup, workersGroup, fxGroup, physicsSuppliesGroup
        ].forEach(g => { while (g.children.length > 0) g.remove(g.children[0]); });
        state.draggableSupplies = [];

        toggleXRayMode(false);
        createProceduralTerrainMesh();
        populateNatureAndSplats();
        placeMixerStationOnTerrain();
        restockSupplies();
        blueprintGroup.visible = true;
        document.getElementById('worker-btn-label').textContent = 'Ajudante (0/3)';
        syncPhaseUI();
        selectTool('room');
        showToast(`Novo terreno procedural gerado! (SEED #${state.seed})`, '🎲');
    };

    // =========================================================================
    // 17. LOOP PRINCIPAL DE FÍSICA E RENDERIZAÇÃO
    // =========================================================================
    function updatePhysics() {
        const draggingRef = state.draggedItem ? state.draggedItem.ref : null;

        state.looseRebars.forEach(r => {
            if (r.installed || r === draggingRef) return;
            if (!r.grounded) {
                r.vy -= 0.014;
                r.mesh.position.y += r.vy;
                const floorY = getTerrainHeight(r.mesh.position.x, r.mesh.position.z) + 0.14;
                if (r.mesh.position.y <= floorY) {
                    r.mesh.position.y = floorY;
                    if (Math.abs(r.vy) > 0.05) r.vy = -r.vy * 0.28;
                    else { r.vy = 0; r.grounded = true; }
                }
            }
        });

        state.draggableSupplies.forEach(s => {
            if (s.consumed || s === draggingRef) return;
            if (!s.grounded) {
                s.vy -= 0.015;
                s.mesh.position.y += s.vy;
                const floorY = getTerrainHeight(s.mesh.position.x, s.mesh.position.z) + 0.02;
                if (s.mesh.position.y <= floorY) {
                    s.mesh.position.y = floorY;
                    if (Math.abs(s.vy) > 0.04) s.vy = -s.vy * 0.22;
                    else { s.vy = 0; s.grounded = true; }
                }
            }
        });

        state.looseBricks.forEach(b => {
            if (b.placed || b === draggingRef) return;
            if (!b.grounded) {
                b.vy -= 0.015;
                b.mesh.position.y += b.vy;
                const floorY = getTerrainHeight(b.mesh.position.x, b.mesh.position.z) + 0.16;
                if (b.mesh.position.y <= floorY) {
                    b.mesh.position.y = floorY;
                    if (Math.abs(b.vy) > 0.04) b.vy = -b.vy * 0.18;
                    else { b.vy = 0; b.grounded = true; }
                }
            }
        });

        // Animação suave de assentamento de tijolos
        for (let i = state.animatedBricks.length - 1; i >= 0; i--) {
            const ab = state.animatedBricks[i];
            ab.progress += 0.13;
            if (ab.progress >= 1) {
                ab.mesh.position.y = ab.targetY;
                state.animatedBricks.splice(i, 1);
            } else {
                const ease = 1 - Math.pow(1 - ab.progress, 3);
                ab.mesh.position.y = ab.targetY + (1 - ease) * 0.5;
            }
        }

        // Partículas de vazamento hidráulico (se houver ponto desconectado)
        if (state.leakPoints.length > 0 && Math.random() < 0.45) {
            state.leakPoints.forEach(lp => spawnBurst(lp.x, lp.y, lp.z, 0x38bdf8, 2, 0.05));
        }

        // Atualização geral de partículas
        for (let i = state.particles.length - 1; i >= 0; i--) {
            const p = state.particles[i];
            p.life -= 0.042;
            p.vy -= 0.0038;
            p.mesh.position.x += p.vx;
            p.mesh.position.y += p.vy;
            p.mesh.position.z += p.vz;
            p.mesh.scale.setScalar(Math.max(0.01, p.life));
            if (p.life <= 0) {
                fxGroup.remove(p.mesh);
                state.particles.splice(i, 1);
            }
        }
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        camOrbit.radius = getIdealRadius();
    });

    let lastTime = performance.now();
    function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const t = now * 0.001;

        updatePhysics();
        updateWorkers(dt, t);

        if (waterTex) {
            waterTex.offset.x = Math.sin(t * 0.25) * 0.06;
            waterTex.offset.y = t * 0.025;
        }
        if (mixerBarGroup.visible) mixerBarGroup.lookAt(camera.position);

        camera.position.x = camOrbit.target.x + camOrbit.radius * Math.sin(camOrbit.phi) * Math.sin(camOrbit.theta);
        camera.position.y = camOrbit.target.y + camOrbit.radius * Math.cos(camOrbit.phi);
        camera.position.z = camOrbit.target.z + camOrbit.radius * Math.sin(camOrbit.phi) * Math.cos(camOrbit.theta);
        camera.lookAt(camOrbit.target);
        renderer.render(scene, camera);
    }

    // Inicialização garantida no window.onload
    window.onload = function() {
        createDioramaBase();
        createProceduralTerrainMesh();
        populateNatureAndSplats();
        placeMixerStationOnTerrain();
        restockSupplies();
        syncPhaseUI();
        selectTool('room');
        animate();
    };
    </script>
